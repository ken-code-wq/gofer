<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ws://127.0.0.1:*; img-src 'self' data:" />
<title>Voice Browser</title>
<style>
  /*
   * Voice Browser command bar.
   * Restrained: cool-tinted neutrals, one accent (the user's macOS accent colour) for focus, caret,
   * primary action and selection only. Status colours always come with an icon or a word.
   * Type: SF Pro, 11 / 12 / 13 / 15 / 20. Radii: 6 small, 8 controls, 10 popovers.
   */
  :root {
    color-scheme: light dark;
    --surface: rgb(247 247 249 / .96);
    --raised: #ffffff;
    --sunken: rgb(18 20 28 / .045);
    --text: #1b1c20;
    --text-2: #4f525a;      /* 7.6:1 on surface */
    --text-3: #676a72;      /* 5.2:1 on surface */
    --hair: rgb(18 20 28 / .09);
    --hover: rgb(18 20 28 / .05);
    --press: rgb(18 20 28 / .09);
    --ok: #17773d;
    --warn: #8f5400;
    --err: #b8322a;
    --accent: #0a63d6;
    --accent-fill: #0a63d6;
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgb(18 20 40 / .06), 0 10px 28px rgb(18 20 40 / .14);
    --ease: cubic-bezier(.25, 1, .5, 1); /* ease-out-quart */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: rgb(29 30 33 / .96);
      --raised: #2a2b30;
      --sunken: rgb(255 255 255 / .045);
      --text: #ececef;
      --text-2: #b9bac0;    /* 9.3:1 on surface */
      --text-3: #9a9ca3;    /* 6.4:1 on surface */
      --hair: rgb(255 255 255 / .08);
      --hover: rgb(255 255 255 / .06);
      --press: rgb(255 255 255 / .1);
      --ok: #5fd28b;
      --warn: #f2b45a;
      --err: #ff8478;
      --accent: #4c9dff;
      --accent-fill: #1f6fd6;  /* white text 4.9:1 */
      --on-accent: #ffffff;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .42);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  html { background: var(--surface); }
  body {
    display: flex; flex-direction: column;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
  ol, ul { list-style: none; }
  svg { display: block; flex: none; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  kbd {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
    font: 500 11px/1 -apple-system, system-ui, sans-serif; color: var(--text-2);
    background: var(--sunken); border-radius: 5px; box-shadow: inset 0 0 0 1px var(--hair);
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ── header (drag handle) ─────────────────────────────── */
  .top { -webkit-app-region: drag; display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 8px 0 16px; flex: none; }
  .brand { font-size: 12px; font-weight: 500; color: var(--text-3); letter-spacing: -.005em; }
  .spacer { flex: 1; }
  .pill, .icon { -webkit-app-region: no-drag; transition: background .15s var(--ease), color .15s var(--ease); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; max-width: 200px; padding: 0 7px 0 6px;
    border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--text-2);
  }
  .pill:hover { background: var(--hover); color: var(--text); }
  .pill:active { background: var(--press); }
  .pill .b-ic { width: 16px; height: 16px; display: grid; place-items: center; color: var(--text-3); }
  .pill .b-ic img { width: 16px; height: 16px; }
  .pill .b-ic svg { width: 15px; height: 15px; }
  .pill .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .caret { width: 11px; height: 11px; color: var(--text-3); }
  .pill[data-state="off"] .name { color: var(--warn); }
  .icon { width: 28px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
  .icon:hover { background: var(--hover); color: var(--text); }
  .icon:active { background: var(--press); }
  .icon svg { width: 16px; height: 16px; }

  /* ── prompt ─────────────────────────────────────────── */
  .prompt { display: flex; align-items: flex-start; gap: 10px; padding: 2px 12px 12px 16px; flex: none; }
  .lead { height: 32px; display: grid; place-items: center; color: var(--text-3); }
  .lead svg { width: 18px; height: 18px; }
  .lead[hidden] { display: none; }
  .composer {
    -webkit-app-region: no-drag; flex: 1; min-width: 0; max-height: 96px; overflow-y: auto; scrollbar-width: none;
    padding: 2px 0; font: 400 20px/28px -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    letter-spacing: -.012em; color: var(--text); white-space: pre-wrap; word-break: break-word;
    outline: none; user-select: text; cursor: text; caret-color: var(--accent);
  }
  .composer::-webkit-scrollbar { display: none; }
  .composer:empty::before { content: attr(data-placeholder); color: var(--text-3); pointer-events: none; }
  .composer.off { opacity: .5; cursor: default; }
  .go {
    -webkit-app-region: no-drag; height: 32px; min-width: 32px; padding: 0 8px; border-radius: 8px;
    display: grid; place-items: center; color: var(--text-3); transition: background .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
  }
  .go svg { width: 16px; height: 16px; }
  .go.ready { color: var(--accent); background: var(--hover); box-shadow: inset 0 0 0 1px var(--hair); }
  .go.ready:hover { background: var(--press); }
  .go:active { transform: scale(.96); }
  .go[disabled] { opacity: 0; pointer-events: none; }

  /* follow-up context, inline before the composer */
  .reply {
    -webkit-app-region: no-drag; display: none; align-items: center; gap: 6px; flex: none; max-width: 42%;
    height: 28px; margin-top: 2px; padding: 0 4px 0 8px; border-radius: 8px;
    font-size: 12px; color: var(--text-2); background: var(--sunken); box-shadow: inset 0 0 0 1px var(--hair);
    animation: pop .16s var(--ease);
  }
  .reply.on { display: inline-flex; }
  .reply > svg { width: 14px; height: 14px; color: var(--text-3); }
  .reply .what { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply .x { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: var(--text-3); }
  .reply .x:hover { background: var(--hover); color: var(--text); }
  .reply .x svg { width: 11px; height: 11px; }

  /* ── tab chips: favicon + short title, tinted with the site's own colour ── */
  .chip {
    display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; position: relative; top: -2px;
    height: 26px; max-width: 240px; padding: 0 9px 0 6px; margin: 0 2px; border-radius: 8px;
    font: 500 15px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: -.005em; color: var(--text);
    background: rgb(var(--chip, 120 124 134) / .13); box-shadow: inset 0 0 0 1px rgb(var(--chip, 120 124 134) / .30);
    user-select: none; white-space: nowrap; animation: pop .14s var(--ease);
  }
  .chip img, .chip .letter { width: 16px; height: 16px; flex: none; border-radius: 4px; object-fit: contain; }
  .chip .letter { display: grid; place-items: center; font: 700 10px/1 -apple-system, system-ui, sans-serif; color: #fff; background: rgb(var(--chip, 120 124 134)); }
  .chip .t { overflow: hidden; text-overflow: ellipsis; }
  .chip .x { display: grid; place-items: center; width: 16px; height: 16px; margin: 0 -4px 0 -2px; border-radius: 50%; color: var(--text-2); opacity: 0; transition: opacity .12s var(--ease); }
  .chip:hover .x { opacity: 1; }
  .chip .x:hover { background: var(--press); }
  .chip .x svg { width: 9px; height: 9px; }
  @media (prefers-color-scheme: dark) { .chip[data-dark] img { background: #ececf0; padding: 1px; } }
  /* chips in lists are smaller */
  .row .chip, .reply .chip, .ask .chip { height: 20px; max-width: 170px; padding: 0 7px 0 4px; gap: 5px; border-radius: 6px; font-size: 12px; top: -1px; animation: none; }
  .row .chip img, .row .chip .letter, .reply .chip img, .reply .chip .letter { width: 13px; height: 13px; border-radius: 3px; font-size: 8.5px; }

  /* ── status: only present when something is happening ── */
  .status {
    display: none; align-items: center; gap: 8px; min-height: 36px; padding: 6px 12px 6px 16px; flex: none;
    font-size: 12px; color: var(--text-2); border-top: 1px solid var(--hair);
  }
  .status.on { display: flex; animation: drop .16s var(--ease); }
  .status .ic { width: 15px; height: 15px; display: grid; place-items: center; }
  .status .ic svg { width: 15px; height: 15px; }
  .status.ok .ic { color: var(--ok); } .status.warn .ic { color: var(--warn); } .status.err .ic { color: var(--err); }
  .status.err .msg { color: var(--text); }
  .status .msg { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .acts { display: flex; gap: 6px; flex: none; }
  .spin { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--hair); border-top-color: var(--text-2); animation: spin .8s linear infinite; }

  /* buttons used in prompts and forms */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px;
    font-size: 12px; font-weight: 500; color: var(--text); background: var(--hover); box-shadow: inset 0 0 0 1px var(--hair);
    white-space: nowrap; transition: background .15s var(--ease), transform .1s var(--ease);
  }
  .btn:hover { background: var(--press); }
  .btn:active { transform: scale(.97); }
  .btn.primary { color: var(--on-accent); background: var(--accent-fill); box-shadow: none; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn kbd { height: 16px; min-width: 16px; font-size: 10px; background: transparent; box-shadow: inset 0 0 0 1px currentColor; color: inherit; opacity: .7; }
  .btn .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-2); }
  .btn svg { width: 13px; height: 13px; }
  .link svg { width: 13px; height: 13px; }
  .link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-2); padding: 3px 6px; border-radius: 6px; text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
  .link:hover { color: var(--text); background: var(--hover); }

  /* ── @ tab picker ───────────────────────────────────── */
  .mentions {
    position: fixed; left: 40px; right: 16px; z-index: 10; max-height: 252px; overflow-y: auto; padding: 5px;
    border-radius: 10px; background: var(--raised); box-shadow: var(--shadow), inset 0 0 0 1px var(--hair);
    transform-origin: top; animation: menu .14s var(--ease);
  }
  .mention { display: grid; grid-template-columns: 16px 1fr; gap: 1px 10px; align-items: center; padding: 6px 9px; border-radius: 7px; }
  .mention .ic { grid-row: 1 / 3; width: 16px; height: 16px; color: var(--text-3); }
  .mention .ic img, .mention .ic .letter { width: 16px; height: 16px; border-radius: 4px; }
  .mention .ic .letter { display: grid; place-items: center; font: 700 10px/1 -apple-system, system-ui, sans-serif; color: #fff; background: rgb(var(--chip)); }
  .mention .ic svg { width: 16px; height: 16px; }
  .mention .t { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mention .u { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mention .cur { font-size: 11px; margin-left: 8px; color: var(--text-3); }
  .mention.on { background: var(--accent-fill); }
  .mention.on .t, .mention.on .u, .mention.on .cur { color: var(--on-accent); }
  .mentions .none { padding: 10px; font-size: 12px; color: var(--text-3); }

  /* ── tabs ───────────────────────────────────────────── */
  .tabs { display: flex; align-items: center; gap: 2px; height: 36px; padding: 0 10px; border-top: 1px solid var(--hair); flex: none; }
  .tabs button { height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--text-3); }
  .tabs button:hover { color: var(--text-2); background: var(--hover); }
  .tabs button[aria-selected="true"] { color: var(--text); background: var(--hover); }
  .tabs .note { font-size: 11px; color: var(--text-3); padding-right: 6px; }

  /* ── activity list ──────────────────────────────────── */
  .activity { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 10px; }
  .activity::-webkit-scrollbar { width: 8px; }
  .activity::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 4px; }
  .row {
    position: relative; display: grid; grid-template-columns: 16px 1fr; gap: 0 10px; align-items: start;
    padding: 8px 10px; border-radius: 8px; transition: background .15s var(--ease);
  }
  .row:hover { background: var(--hover); }
  .row:focus-visible { outline-offset: -2px; }
  .row.reply-target { background: var(--sunken); }
  .row[data-new] { animation: fade .2s var(--ease); }
  .mark { width: 16px; height: 18px; display: grid; place-items: center; color: var(--text-3); }
  .mark svg { width: 14px; height: 14px; }
  .mark.ok { color: var(--ok); } .mark.fail { color: var(--err); } .mark.awaiting { color: var(--warn); }
  .mark.pending::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); }
  .main { min-width: 0; }
  .line { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .cmd { min-width: 0; flex: 1; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.open > .main > .line .cmd { white-space: normal; color: var(--text-2); font-weight: 500; }
  .sum { min-width: 0; flex: 0 1 45%; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .time { flex: none; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .understood { margin-top: 6px; font-size: 12px; color: var(--text-2); }
  .understood b { font-weight: 500; color: var(--text-3); margin-right: 6px; }
  .steps-toggle { margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-3); padding: 2px 6px 2px 2px; border-radius: 6px; }
  .steps-toggle:hover { color: var(--text-2); background: var(--hover); }
  .steps-toggle svg { width: 11px; height: 11px; transition: transform .15s var(--ease); }
  .steps-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  .row[data-i="0"] > .main > .result { font-size: 15px; }
  .result { margin-top: 4px; font-size: 14px; line-height: 1.45; color: var(--text); white-space: pre-wrap; user-select: text; }
  .row.fail .result { color: var(--text-2); }
  .steps { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .step { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start; font-size: 12px; color: var(--text-2); }
  .step .mark { height: 16px; }
  .step .mark svg { width: 12px; height: 12px; }
  .step.running { color: var(--text); }
  .step.pending { color: var(--text-3); }
  .step .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step small { margin-left: 8px; font-size: 11px; color: var(--text-3); }
  .turn { margin-top: 10px; display: grid; grid-template-columns: 16px 1fr; gap: 0 10px; }
  .turn .rp { display: inline-block; margin-right: 6px; color: var(--text-3); vertical-align: -2px; }
  .turn .rp svg { display: inline-block; width: 13px; height: 13px; transform: scaleY(-1); }
  .turn .cmd { white-space: normal; color: var(--text-2); font-weight: 500; }

  /* row actions: on hover or keyboard focus */
  .acts-row { position: absolute; top: 5px; right: 6px; display: none; gap: 2px; padding-left: 12px; background: linear-gradient(90deg, transparent, var(--surface) 10px); }
  .row:hover > .acts-row, .row:focus-within > .acts-row { display: flex; }
  .row:hover > .main > .line > .time, .row:focus-within > .main > .line > .time { visibility: hidden; }
  .act { width: 26px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--text-2); background: var(--surface); }
  .act:hover { background: var(--press); color: var(--text); }
  .act svg { width: 15px; height: 15px; }

  /* consent / choice, inline under the step it's about */
  .ask {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--raised);
    box-shadow: inset 0 0 0 1px var(--hair), 0 1px 2px rgb(0 0 0 / .05); animation: drop .18s var(--ease);
  }
  .ask p { font-size: 13px; color: var(--text); }
  .ask .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }

  /* empty states and lists in Saved / Passwords */
  .empty { padding: 18px 10px 8px; }
  .empty p { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
  .example { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--text); text-align: left; }
  .example:hover, .example:focus-visible { background: var(--hover); }
  .example svg { width: 14px; height: 14px; color: var(--text-3); }
  .name { font-weight: 600; }
  .sub { margin-top: 2px; font-size: 12px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--text-2); background: var(--sunken); box-shadow: inset 0 0 0 1px var(--hair); vertical-align: 1px; }
  .token { font: 500 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }
  .listhead { display: flex; align-items: center; gap: 12px; padding: 12px 10px 8px; }
  .listhead p { flex: 1; font-size: 12px; color: var(--text-2); }
  .form { display: flex; gap: 6px; padding: 0 10px 10px; animation: drop .16s var(--ease); }
  .field {
    -webkit-app-region: no-drag; user-select: text; height: 28px; min-width: 0; flex: 1; padding: 0 10px; border-radius: 8px;
    font: 13px -apple-system, system-ui, sans-serif; color: var(--text); background: var(--raised);
    border: 1px solid var(--hair); outline: none;
  }
  .field::placeholder { color: var(--text-3); }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

  /* ── footer ─────────────────────────────────────────── */
  .foot { display: flex; align-items: center; gap: 14px; height: 32px; padding: 0 12px 0 16px; border-top: 1px solid var(--hair); flex: none; font-size: 11px; color: var(--text-3); }
  .foot .hint { display: inline-flex; align-items: center; gap: 6px; }
  .hotkey { -webkit-app-region: no-drag; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 11px; color: var(--text-3); }
  .hotkey:hover { background: var(--hover); color: var(--text-2); }
  .hotkey.recording kbd { color: var(--on-accent); background: var(--accent-fill); box-shadow: none; }

  /* ── motion: state changes only ─────────────────────── */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-3px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  @keyframes menu { from { opacity: 0; transform: translateY(-4px) scale(.99); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
    .spin { border-top-color: var(--text-3); border-style: dotted; }
  }

  /* narrow windows */
  @media (max-width: 620px) {
    .composer { font-size: 17px; line-height: 26px; }
    .chip { height: 24px; font-size: 13px; max-width: 180px; }
    .reply { max-width: 34%; }
    .foot .hint.extra { display: none; }
    .sum { display: none; }
  }
  /* compact window: just the prompt, and status when something is happening */
  @media (max-height: 190px) {
    .tabs, .activity, .foot { display: none; }
  }
</style>
</head>
<body>
  <header class="top">
    <span class="brand">Voice Browser</span>
    <span class="spacer"></span>
    <button class="pill" id="browser" data-state="off" title="Choose the browser to control" aria-haspopup="menu">
      <span class="b-ic" id="browser-ic"></span><span class="name" id="browser-name">Connecting…</span><span class="caret" id="caret"></span>
    </button>
    <button class="icon" id="more" title="More" aria-haspopup="menu" aria-label="More"></button>
  </header>

  <form class="prompt" id="form">
    <span class="lead" id="lead" aria-hidden="true"></span>
    <div class="reply" id="reply"><span id="reply-ic"></span><span class="what" id="reply-what"></span><button class="x" id="reply-x" type="button" title="Stop following up (Esc)" aria-label="Stop following up"></button></div>
    <div id="cmd" class="composer off" contenteditable="false" role="textbox" aria-label="Command" aria-multiline="true" spellcheck="false" data-placeholder="Type or dictate what to do"></div>
    <button class="go" id="go" type="submit" title="Run (Enter)" aria-label="Run" disabled></button>
  </form>

  <div class="mentions" id="mentions" role="listbox" aria-label="Open tabs" hidden></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>

0,0,40,56V200a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Zm0,160H56V56H200V200Z\"/></svg>","warn":"<svg viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z\"/></svg>","retry":"<svg viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M240,56v48a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16H211.4L184.81,71.64l-.25-.24a80,80,0,1,0-1.67,114.78,8,8,0,0,1,11,11.63A95.44,95.44,0,0,1,128,224h-1.32A96,96,0,1,1,195.75,60L224,85.8V56a8,8,0,1,1,16,0Z\"/></svg>","image":"<svg viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z\"/></svg>","plus":"<svg viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z\"/></svg>","chevron":"<svg viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z\"/></svg>","arrow":"<svg viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"/></svg>"}; // Phosphor (regular), MIT
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const wsUrl = new URLSearchParams(location.search).get("ws");
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  $("lead").innerHTML = ICON.chevron;
  $("go").innerHTML = ICON.enter;
  $("more").innerHTML = ICON.more;
  $("caret").innerHTML = ICON.caretDown;
  $("browser-ic").innerHTML = ICON.globe;
  $("reply-ic").innerHTML = ICON.reply;
  $("reply-x").innerHTML = ICON.x;

  // ── state ───────────────────────────────────────────────
  let ws = null;
  let model = "";
  let browserBusy = false; // switching browsers: the server restarts, so disconnects are expected
  let tab = "recent";
  let replyTo = null; // history entry the next command follows up on
  let current = null; // the command (or follow-up turn) awaiting a result
  let currentRoot = null; // the history entry it belongs to
  let busy = false; // a command is running
  let lastText = ""; // for Retry
  let saved = [];
  let secrets = [];
  let addingSecret = false;
  let recall = -1;
  let prompt = null; // keyboard shortcuts for the visible prompt: { primary, cancel, numbered: [fn] }

  const HISTORY_KEY = "vb.history.v1";
  const history = (() => {
    try {
      const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      for (const e of h) {
        e.id ||= uid();
        delete e.ask; delete e.open;
        if (e.status === "running") { e.status = "ignored"; e.detail = "Interrupted"; }
        for (const t of e.turns || []) { delete t.ask; if (t.status === "running") { t.status = "ignored"; t.detail = "Interrupted"; } }
      }
      return Array.isArray(h) ? h : [];
    } catch { return []; }
  })();
  let saveTimer = null;
  const persist = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 100), (k, v) => (k === "ask" ? undefined : v))), 200);
  };
  const send = (obj) => ws && ws.readyState === 1 && (ws.send(JSON.stringify(obj)), true);

  // ── accent: the user's macOS accent colour ──────────────
  function applyAccent(hex) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || "")) return;
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const lin = (c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    document.documentElement.style.setProperty("--accent", hex);
    // Buttons and selections keep white text (native look): darken the fill until white passes AA (4.5:1).
    let k = 1, fill = [r, g, b];
    const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
    while (1.05 / (lum(fill) + 0.05) < 4.5 && k > 0.4) { k -= 0.03; fill = [r * k, g * k, b * k]; }
    const toHex = (c) => "#" + c.map((v) => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
    document.documentElement.style.setProperty("--accent-fill", toHex(fill));
    document.documentElement.style.setProperty("--on-accent", "#ffffff");
  }
  window.bar.getAccent?.().then(applyAccent).catch(() => {});

  // ── status line ─────────────────────────────────────────
  // kinds: busy (spinner + Stop), ok, warn, err, info. Hidden when idle.
  let statusTimer = null;
  function setStatus(text, kind = "info", actions = []) {
    clearTimeout(statusTimer);
    const s = $("status");
    const ic = kind === "busy" ? '<span class="spin"></span>' : kind === "ok" ? ICON.check : kind === "warn" || kind === "err" ? ICON.warn : "";
    s.className = `status on ${kind}`;
    s.innerHTML = `${ic ? `<span class="ic">${ic}</span>` : ""}<span class="msg">${esc(text)}</span><span class="acts"></span>`;
    for (const a of actions) s.querySelector(".acts").appendChild(button(a));
    if (busy && !prompt && kind !== "busy" && kind !== "err") addStop();
    if (kind === "ok" || kind === "info") statusTimer = setTimeout(() => !busy && clearStatus(), 5000);
  }
  function clearStatus() { $("status").className = "status"; $("status").innerHTML = ""; }
  function addStop() {
    const acts = $("status").querySelector(".acts");
    if (acts && !acts.querySelector("[data-stop]")) {
      const b = button({ label: "Stop", kbd: "esc", action: stopAll });
      b.dataset.stop = "1";
      acts.appendChild(b);
    }
  }
  function setProgress(text) {
    setStatus(text, "busy");
    if (!prompt) addStop();
  }
  /** { label, kbd, primary, n, link, icon, action } -> <button> */
  function button(a) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = a.link ? "link" : `btn${a.primary ? " primary" : ""}`;
    b.innerHTML = `${a.icon ? ICON[a.icon] : ""}${a.n ? `<span class="n">${a.n}</span>` : ""}<span>${esc(a.label)}</span>${a.kbd ? `<kbd>${esc(a.kbd)}</kbd>` : ""}`;
    b.onclick = (e) => { e.stopPropagation(); a.action(); };
    return b;
  }

  // ── prompts: confirm / allow / which one, inline under the running command ──
  function ask(text, choices, { numbered = false } = {}) {
    const target = current || currentRoot;
    if (!target) { setStatus(text, "warn", choices); return; }
    target.ask = { text, choices };
    prompt = {
      primary: choices.find((c) => c.primary)?.action || null,
      cancel: choices.find((c) => c.cancel)?.action || null,
      numbered: numbered ? choices.map((c) => c.action) : null,
    };
    setStatus(numbered ? "Waiting for you to choose" : "Waiting for your OK", "warn");
    render();
  }
  function closeAsk() {
    for (const e of [current, currentRoot]) if (e) delete e.ask;
    prompt = null;
    render();
  }
  const answer = (fn) => () => { closeAsk(); fn(); };

  // ── list rendering ──────────────────────────────────────
  const shortUrl = (u) => {
    try { const x = new URL(u); return (x.host.replace(/^www\./, "") + decodeURIComponent(x.pathname + x.search)).replace(/\/$/, "").slice(0, 90); }
    catch { return String(u || "").slice(0, 90); }
  };
  const ago = (t) => {
    const s = Math.round((Date.now() - t) / 1000);
    return s < 10 ? "now" : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`;
  };
  const MARK = { ok: "check", fail: "x", ignored: "skip", awaiting: "hand" };
  const LABEL = { ok: "Done", fail: "Failed", ignored: "Skipped", awaiting: "Waiting for you", running: "Running", pending: "Not started" };
  const mark = (status) =>
    status === "running"
      ? `<span class="mark" title="Running"><span class="spin"></span></span>`
      : `<span class="mark ${status}" title="${LABEL[status] || ""}">${MARK[status] ? ICON[MARK[status]] : ""}<span class="sr">${LABEL[status] || ""}</span></span>`;

  // Typing a command never hides history. Start with "/" to search it instead: "/bills".
  const query = () => { const t = cmdText(); return !replyTo && t.startsWith("/") ? t.slice(1).trim().toLowerCase() : ""; };
  const matches = (...fields) => !query() || fields.some((f) => String(f || "").toLowerCase().includes(query()));
  const openIds = new Set(); // entries the user expanded or collapsed (toggled from the default)
  // newest, running, or waiting-for-you entries start open; a click flips that
  const isOpen = (h, i) => {
    const def = i === 0 || h.status === "running" || Boolean(h.ask) || (h.turns || []).some((t) => t.ask || t.status === "running");
    return openIds.has(h.id) ? !def : def;
  };

  function render() {
    persist();
    document.querySelectorAll(".tabs [role=tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    $("filter-note").textContent = query() && tab !== "secrets" ? "Searching history" : "";
    $("esc-hint").innerHTML = `<kbd>esc</kbd>${busy ? "stop" : replyTo ? "cancel follow-up" : "hide"}`;
    if (tab === "saved") renderSaved();
    else if (tab === "secrets") renderSecrets();
    else renderRecent();
    paintChips($("activity"));
  }

  const EXAMPLES = [
    "go to wikipedia and search for alan turing",
    "what is this page about?",
    "fill the form with name Alex Ward, role editor",
    "help me approve every pending request under $500",
  ];
  function renderRecent() {
    const a = $("activity");
    if (!history.length) {
      a.innerHTML = `<div class="empty"><p>Type what you want the browser to do, or start from an example.</p>
        ${EXAMPLES.map((x) => `<button class="example" data-example="${esc(x)}">${ICON.chevron}<span>${esc(x)}</span></button>`).join("")}</div>`;
      return;
    }
    const rows = history.map((h, i) => [h, i]).filter(([h]) => matches(h.text, h.detail, ...(h.turns || []).map((t) => t.text)));
    if (!rows.length) { a.innerHTML = `<div class="empty"><p>Nothing in your history matches “${esc(cmdText())}”.</p></div>`; return; }
    a.innerHTML = rows.map(([h, i]) => entryHTML(h, i)).join("");
  }

  function bodyHTML(e) {
    return `${e.resolved ? `<div class="understood"><b>Understood as</b>${esc(e.resolved)}</div>` : ""}
      ${e.detail ? `<p class="result">${esc(e.detail)}</p>` : ""}
      ${e.steps?.length && !(e.status === "running" || e.ask || e.showSteps) ? `<button class="steps-toggle" type="button" data-steps aria-expanded="false">${ICON.chevron}${e.steps.length} step${e.steps.length === 1 ? "" : "s"}</button>` : ""}
      ${e.steps?.length && (e.status === "running" || e.ask || e.showSteps) ? `${e.showSteps && e.status !== "running" && !e.ask ? `<button class="steps-toggle" type="button" data-steps aria-expanded="true">${ICON.chevron}${e.steps.length} step${e.steps.length === 1 ? "" : "s"}</button>` : ""}<ol class="steps">${e.steps.map((s) => `<li class="step ${s.status}">${mark(s.status)}<span class="t">${esc(s.text)}${s.detail ? `<small>${esc(s.detail)}</small>` : ""}</span></li>`).join("")}</ol>` : ""}
      ${e.ask ? `<div class="ask"><p>${esc(e.ask.text)}</p><div class="acts" data-ask></div></div>` : ""}`;
  }
  function entryHTML(h, i) {
    const open = isOpen(h, i);
    const summary = !open && (h.turns?.length ? h.turns.at(-1).detail || h.turns.at(-1).text : h.detail);
    return `<div class="row ${h.status}${open ? " open" : ""}${h === replyTo ? " reply-target" : ""}" role="listitem" tabindex="0" data-i="${i}" ${h === current ? "data-new" : ""}
        aria-expanded="${open}" title="${open ? "Collapse" : "Expand"} (Space). Enter puts it in the prompt.">
      ${mark(h.status)}
      <div class="main">
        <div class="line"><span class="cmd">${richText(h.text, h.icons)}</span>${summary ? `<span class="sum">${esc(summary)}</span>` : ""}<span class="time">${ago(h.at)}</span></div>
        ${open ? bodyHTML(h) : ""}
        ${open ? (h.turns || []).map((t) => `
          <div class="turn">${mark(t.status)}<div class="main">
            <div class="line"><span class="cmd"><span class="rp" title="Follow-up">${ICON.reply}</span>${richText(t.text, t.icons || h.icons)}</span><span class="time">${ago(t.at)}</span></div>
            ${bodyHTML(t)}</div></div>`).join("") : ""}
      </div>
      <div class="acts-row">
        ${h.status !== "running" ? `<button class="act" data-act="reply" title="Follow up (R)" aria-label="Follow up">${ICON.reply}</button>` : ""}
        <button class="act" data-act="load" title="Put in the prompt (Enter)" aria-label="Put in the prompt">${ICON.enter}</button>
        <button class="act" data-act="save" title="Save as a named command" aria-label="Save">${ICON.bookmark}</button>
      </div>
    </div>`;
  }
  // attach prompt buttons after rendering (they hold closures)
  const _renderRecent = renderRecent;
  renderRecent = function () {
    _renderRecent();
    for (const el of $("activity").querySelectorAll("[data-ask]")) {
      const row = el.closest(".row");
      const h = history[Number(row.dataset.i)];
      const e = h?.ask ? h : (h?.turns || []).find((t) => t.ask);
      for (const c of e?.ask?.choices || []) el.appendChild(button(c));
    }
  };

  function renderSaved() {
    const a = $("activity");
    if (!saved.length) {
      a.innerHTML = `<div class="empty"><p>No saved commands yet. Use the star on a command in Recent, then run it by typing its name.</p></div>`;
      return;
    }
    const rows = saved.filter((c) => matches(c.name, c.text));
    a.innerHTML = rows.map((c) => `
      <div class="row" role="listitem" tabindex="0" data-saved="${esc(c.name)}" title="Enter puts it in the prompt">
        <span class="mark">${ICON.bookmark}</span>
        <div class="main"><div class="line"><span class="cmd name">${esc(c.name)}</span><span class="time">Type “${esc(c.name)}” to run</span></div><div class="sub">${esc(c.text)}</div></div>
        <div class="acts-row">
          <button class="act" data-act="run-saved" data-name="${esc(c.name)}" title="Run" aria-label="Run">${ICON.play}</button>
          <button class="act" data-act="delete-cmd" data-name="${esc(c.name)}" title="Delete" aria-label="Delete">${ICON.trash}</button>
        </div>
      </div>`).join("") || `<div class="empty"><p>Nothing matches “${esc(cmdText())}”.</p></div>`;
  }

  function renderSecrets() {
    const a = $("activity");
    a.innerHTML = `
      <div class="listhead"><p>Use <span class="token">{{name}}</span> in a command. The value is typed into the page and never sent to the AI.</p>
        <button class="btn" id="add-secret" type="button">${ICON.plus}<span>Add</span></button></div>
      ${addingSecret ? `<form class="form" id="secret-form">
        <input class="field" id="secret-name" placeholder="Name, e.g. dev-password" aria-label="Name" autocomplete="off" spellcheck="false" />
        <input class="field" id="secret-value" type="password" placeholder="Password" aria-label="Password" autocomplete="new-password" />
        <button class="btn primary" type="submit">Save</button></form>` : ""}
      ${secrets.map((n) => `
        <div class="row" role="listitem" tabindex="0">
          <span class="mark">${ICON.key}</span>
          <div class="main"><div class="line"><span class="cmd token">{{${esc(n)}}}</span><span class="time">In Keychain</span></div></div>
          <div class="acts-row"><button class="act" data-act="delete-secret" data-name="${esc(n)}" title="Delete from Keychain" aria-label="Delete">${ICON.trash}</button></div>
        </div>`).join("")}
      ${!secrets.length && !addingSecret ? `<div class="empty"><p>No passwords yet.</p></div>` : ""}`;
    $("add-secret").onclick = () => { addingSecret = !addingSecret; render(); if (addingSecret) $("secret-name").focus(); };
    $("secret-form")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("secret-name").value.trim(), value = $("secret-value").value;
      if (!name || !value) return setStatus("Give the password a name and a value.", "warn");
      send({ type: "secrets:set", name, value });
      addingSecret = false;
      setStatus(`Saved {{${name}}} to your Keychain.`, "ok");
    });
  }

  $("activity").addEventListener("click", (e) => {
    const ex = e.target.closest("[data-example]");
    if (ex) return setCmd(ex.dataset.example);
    const act = e.target.closest(".act");
    const row = e.target.closest(".row");
    if (act) {
      e.stopPropagation();
      const name = act.dataset.name;
      const h = row?.dataset.i !== undefined ? history[Number(row.dataset.i)] : null;
      if (act.dataset.act === "reply" && h) setReply(h);
      else if (act.dataset.act === "load" && h) setCmd(h.text);
      else if (act.dataset.act === "save" && h) askSaveAs(h.text);
      else if (act.dataset.act === "run-saved") run(name);
      else if (act.dataset.act === "delete-cmd") { send({ type: "commands:delete", name }); setStatus(`Deleted “${name}”.`, "ok"); }
      else if (act.dataset.act === "delete-secret") { send({ type: "secrets:delete", name }); setStatus(`Removed {{${name}}} from your Keychain.`, "ok"); }
      return;
    }
    const st = e.target.closest("[data-steps]");
    if (st && row?.dataset.i !== undefined) {
      const h = history[Number(row.dataset.i)];
      const turnEl = st.closest(".turn");
      const target = turnEl ? h.turns[[...row.querySelectorAll(".turn")].indexOf(turnEl)] : h;
      target.showSteps = !target.showSteps;
      return render();
    }
    if (!row || e.target.closest("button, .ask, a")) return;
    if (row.dataset.saved) return setCmd(row.dataset.saved);
    if (row.dataset.i !== undefined) toggle(Number(row.dataset.i));
  });
  function toggle(i) {
    const h = history[i];
    openIds.has(h.id) ? openIds.delete(h.id) : openIds.add(h.id);
    render();
    $("activity").querySelector(`.row[data-i="${i}"]`)?.focus();
  }
  // keyboard in the list
  $("activity").addEventListener("keydown", (e) => {
    const row = e.target.closest?.(".row");
    if (!row || e.target !== row) return;
    const rows = [...$("activity").querySelectorAll(".row")];
    const k = rows.indexOf(row);
    if (e.key === "ArrowDown") { e.preventDefault(); rows[k + 1]?.focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); k ? rows[k - 1].focus() : caretToEnd(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (row.dataset.saved) setCmd(row.dataset.saved);
      else if (row.dataset.i !== undefined) setCmd(history[Number(row.dataset.i)].text);
    } else if ((e.key === " " || e.key === "ArrowRight" || e.key === "ArrowLeft") && row.dataset.i !== undefined) { e.preventDefault(); toggle(Number(row.dataset.i)); }
    else if (e.key.toLowerCase() === "r" && row.dataset.i !== undefined) { e.preventDefault(); setReply(history[Number(row.dataset.i)]); }
  });

  document.querySelectorAll(".tabs [role=tab]").forEach((b) => (b.onclick = () => selectTab(b.dataset.tab)));
  function selectTab(t) {
    tab = t;
    if (tab === "secrets") send({ type: "secrets:list" });
    render();
  }

  // ── follow-ups ──────────────────────────────────────────
  function setReply(entry) {
    replyTo = entry;
    $("reply-what").innerHTML = richText(entry.text, entry.icons);
    paintChips($("reply-what"));
    $("reply").classList.add("on");
    $("lead").hidden = true;
    cmd.dataset.placeholder = "Follow up, e.g. now delete the first 2";
    tab = "recent";
    render();
    caretToEnd();
  }
  function clearReply() {
    replyTo = null;
    $("reply").classList.remove("on");
    $("lead").hidden = false;
    cmd.dataset.placeholder = "Type or dictate what to do";
    render();
  }
  $("reply-x").onclick = () => { clearReply(); caretToEnd(); };

  function askSaveAs(text) {
    const suggestion = (text.match(/(?:localhost|[\w-]+\.\w+)[^\s,]*/)?.[0] || text).split(/[/:,\s]/)[0].slice(0, 20).toLowerCase();
    const s = $("status");
    s.className = "status on";
    s.innerHTML = `<form class="form" id="save-form" style="flex:1;padding:0">
      <input class="field" id="save-name" placeholder="Name, e.g. login-dev" aria-label="Name" value="${esc(suggestion)}" spellcheck="false" />
      <button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="save-cancel">Cancel</button></form>`;
    $("save-name").select();
    $("save-cancel").onclick = () => { clearStatus(); caretToEnd(); };
    $("save-form").onsubmit = (e) => {
      e.preventDefault();
      const name = $("save-name").value.trim();
      if (!name) return;
      send({ type: "commands:save", name, text });
      setStatus(`Saved. Type “${name.toLowerCase().replace(/\s+/g, "-")}” to run it.`, "ok");
      tab = "saved";
      render();
      caretToEnd();
    };
  }
  setInterval(() => !document.activeElement?.closest?.(".row, .form") && render(), 30000); // keep "2m" fresh

  // ── running a command ───────────────────────────────────
  /** reply: an answer to a prompt ("confirm", "2"): same thread, no new row. */
  function run(text, { reply = false, icons = null } = {}) {
    const followUp = !reply && Boolean(replyTo);
    const threadId = reply ? currentRoot?.id : followUp ? replyTo.id : uid();
    if (!send({ type: "command", text, thread: threadId, followUp })) return setStatus("Not connected to the browser service yet.", "err");
    if (!reply) {
      if (current && current.status === "running") { current.status = "ignored"; current.detail = "Replaced by a new command"; }
      lastText = text;
      const extra = icons && Object.keys(icons).length ? { icons } : {};
      if (followUp) {
        current = { text, status: "running", at: Date.now(), ...extra };
        (replyTo.turns ||= []).push(current);
        replyTo.at = Date.now();
        history.splice(history.indexOf(replyTo), 1);
        history.unshift(replyTo);
        currentRoot = replyTo;
      } else {
        current = { id: threadId, text, status: "running", at: Date.now(), ...extra };
        history.unshift(current);
        history.splice(100);
        currentRoot = current;
      }
      tab = "recent";
      busy = true;
    }
    setProgress("Working on it");
    render();
  }
  function finish(status, detail) {
    if (current) {
      current.status = status;
      if (detail !== undefined && detail !== null) current.detail = detail;
      delete current.ask;
    }
    if (currentRoot) delete currentRoot.ask;
    prompt = null;
    current = null;
    busy = false;
    render();
    offerFollowUp(currentRoot);
  }
  function offerFollowUp(root) {
    if (!root || replyTo === root) return;
    const acts = $("status").querySelector(".acts");
    if (acts && $("status").classList.contains("on") && !acts.querySelector("[data-fu]")) {
      const b = button({ label: "Follow up", icon: "reply", link: true, action: () => setReply(root) });
      b.dataset.fu = "1";
      acts.appendChild(b);
    }
  }
  function stopAll() {
    send({ type: "stop" });
    closeAsk();
    if (current?.status === "running") finish("ignored", "Stopped");
    setStatus("Stopped.", "info");
    caretToEnd();
  }

  // ── server connection ───────────────────────────────────
  function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      setEnabled(true);
      caretToEnd();
      send({ type: "secrets:list" });
      if (/Reconnecting|Can't reach/.test($("status").textContent)) clearStatus();
    };
    ws.onclose = () => {
      setEnabled(false);
      if (!browserBusy) setStatus("Can't reach the browser service. Reconnecting…", "err");
      setTimeout(connect, 800);
    };
    ws.onmessage = (ev) => handle(JSON.parse(ev.data));
  }

  function handle({ type, payload }) {
    switch (type) {
      case "hello": model = payload.model || ""; break;
      case "tab-list": tabList = payload || []; renderMentions(); break;
      case "commands": saved = payload || []; render(); break;
      case "secrets": secrets = payload || []; render(); break;
      case "store-error": setStatus(payload, "err"); break;
      case "stopped": break;
      case "tab-switched":
        if (current && !payload.rest) { finish("ok", `Switched to ${payload.title}`); setStatus(`Switched to “${payload.title}”.`, "ok"); }
        else setProgress(`In “${payload.title}”`);
        break;
      case "tab-error":
        if (current) finish("fail", payload.error);
        setStatus(payload.error, "err");
        break;
      case "resolved":
        if (current) { current.resolved = payload.goal; render(); }
        break;
      case "expanded":
        if (current && !current.steps) { current.resolved = payload.text; render(); }
        break;
      case "decision": {
        const p = payload.policy;
        if (p.decision === "act") setProgress(capital(p.summary));
        else if (p.decision === "ignore" && current && !current.steps) { finish("ignored", "That didn't sound like a browser command."); setStatus("That didn't sound like a browser command.", "warn"); }
        break;
      }
      case "action": {
        const ok = payload.ok !== false;
        const detail = ok ? shortUrl(payload.detail) : payload.detail;
        if (current?.steps) {
          const s = current.steps.find((x) => x.status === "running");
          if (s) { s.detail = detail; render(); }
        } else if (current) {
          const check = /^(assert|wait)_/.test(payload.action?.type || "");
          finish(ok ? "ok" : "fail", ok ? (check ? payload.detail.replace(/^✓ /, "") : detail) : payload.detail);
          if (!ok && payload.screenshot) setStatus("That didn't work. The reason is below.", "err", [{ label: "Screenshot", icon: "image", action: () => window.bar.openPath(payload.screenshot) }]);
          else setStatus(ok ? "Done." : "That didn't work. The reason is below.", ok ? "ok" : "err", ok ? [] : [{ label: "Retry", icon: "retry", action: retry }]);
          offerFollowUp(currentRoot);
        }
        break;
      }
      case "chain": {
        if (!current) break;
        if (!current.steps) current.steps = payload.steps.map((text) => ({ text, status: "pending" }));
        current.steps.forEach((s, i) => {
          if (i < payload.index) s.status = "ok";
          else if (i === payload.index) s.status = payload.status === "failed" ? "fail" : payload.status === "done" ? "ok" : payload.status === "cancelled" ? "ignored" : "running";
        });
        const n = payload.steps.length;
        if (payload.status === "running") { setProgress(`Step ${payload.index + 1} of ${n}: ${payload.steps[payload.index]}`); render(); }
        else if (payload.status === "done") { finish("ok", null); setStatus(`Done. ${n} steps.`, "ok"); offerFollowUp(currentRoot); }
        else if (payload.status === "failed") {
          finish("fail", capital(payload.reason));
          setStatus("A step didn't work. The reason is below.", "err", payload.screenshot ? [{ label: "Screenshot", icon: "image", action: () => window.bar.openPath(payload.screenshot) }] : [{ label: "Retry", icon: "retry", action: retry }]);
        } else if (payload.status === "cancelled") finish("ignored", "Stopped");
        break;
      }
      case "pending":
        if (payload) ask(`${capital(payload.summary)}?`, [
          { label: "Confirm", kbd: "↵", primary: true, action: answer(() => run("confirm", { reply: true })) },
          { label: "Cancel", kbd: "esc", cancel: true, action: answer(() => run("cancel", { reply: true })) },
        ]);
        break;
      case "candidates":
        if (payload?.length) ask("Which one did you mean?", payload.map((c) => ({ n: c.n, label: c.label.replace(/^\w+ "?|"$/g, ""), action: answer(() => run(String(c.n), { reply: true })) })), { numbered: true });
        break;
      case "gaveup":
        if (current && !current.steps) finish("fail", "Couldn't work out what to do. Try rephrasing, or run it as a goal.");
        setStatus(`Couldn't work out “${payload.transcript}”.`, "warn", [{ label: "Try as a goal", primary: true, action: () => run(`goal: ${payload.transcript}`) }]);
        break;
      case "answer":
        if (current) finish("ok", payload.answer);
        setStatus(`Answered in ${(payload.ms / 1000).toFixed(1)} s.`, "ok");
        offerFollowUp(currentRoot);
        break;
      case "fill": {
        const ok = payload.filled.filter((f) => !f.error);
        const bad = payload.filled.filter((f) => f.error).map((f) => f.label);
        let msg = `Filled ${ok.length} field${ok.length === 1 ? "" : "s"}: ${ok.map((f) => `${f.label} ${f.value}`).join(", ")}.`;
        if (bad.length) msg += ` Couldn't fill ${bad.join(", ")}.`;
        if (payload.missing?.length) msg += ` No field for ${payload.missing.join(", ")}.`;
        msg += " Not submitted.";
        if (current) finish(ok.length ? "ok" : "fail", msg);
        setStatus(`Filled ${ok.length} field${ok.length === 1 ? "" : "s"}. Review it, then submit.`, payload.missing?.length || bad.length ? "warn" : "ok");
        offerFollowUp(currentRoot);
        break;
      }
      case "goal": {
        if (!current) break;
        current.steps = payload.steps.map((s) => ({ text: s.text, status: s.status, detail: s.detail }));
        if (payload.status === "running") { setProgress(payload.steps.length ? `Step ${payload.steps.length}: ${payload.steps.at(-1).text}` : "Looking at the page"); render(); }
        else if (payload.status === "done") { finish("ok", payload.summary); setStatus("Goal done.", "ok"); offerFollowUp(currentRoot); }
        else if (payload.status === "failed") { finish("fail", payload.summary); setStatus("The goal didn't finish. The reason is below.", "err", [{ label: "Retry", icon: "retry", action: retry }]); }
        else if (payload.status === "cancelled") finish("ignored", payload.summary || "Stopped");
        break;
      }
      case "goal-confirm":
        ask(`Allow this step? ${capital(payload.description)}.`, [
          { label: "Allow", kbd: "↵", primary: true, action: answer(() => { send({ type: "goal:answer", ok: true }); setProgress("Continuing"); }) },
          { label: "Stop", kbd: "esc", cancel: true, action: answer(() => send({ type: "goal:answer", ok: false })) },
          { label: "Allow the rest of this goal", link: true, action: answer(() => { send({ type: "goal:answer", ok: true, all: true }); setProgress("Continuing without asking again"); }) },
        ]);
        break;
      case "smart-error":
        { const hadRow = current && current.status === "running";
          if (hadRow) finish("fail", payload.error);
          setStatus(hadRow ? "That didn't work. The reason is below." : payload.error, "err", [{ label: "Retry", icon: "retry", action: retry }]); }
        break;
      case "log":
        if (payload.level === "error" && busy) setStatus(capital(payload.msg), "err");
        break;
    }
  }
  // Retrying something that changes data puts it back in the prompt instead of running it again.
  const RISKY = /\b(delete|remove|approve|reject|pay|submit|send|archive|cancel|purchase|buy|order|transfer|publish|merge|deploy)\b/i;
  function retry() {
    if (RISKY.test(lastText)) { setCmd(lastText); setStatus("Check it, then press Enter to run it again.", "info"); }
    else run(lastText);
  }
  const capital = (s) => (s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : "");

  // ── composer: text + inline tab chips ───────────────────
  // The command is plain text where "@[Tab title]" marks a tab; in the editor each mention is a
  // chip (favicon + title) that behaves like one character.
  const cmd = $("cmd");
  let tabList = [];
  let tabListAt = 0;
  let mention = null;
  let mentionSel = 0;

  const ICONS_KEY = "vb.icons.v1";
  const iconCache = (() => { try { return JSON.parse(localStorage.getItem(ICONS_KEY) || "{}"); } catch { return {}; } })();
  function rememberIcon(title, icon) {
    if (!icon || iconCache[title] === icon) return;
    iconCache[title] = icon;
    const keys = Object.keys(iconCache);
    for (const k of keys.slice(0, Math.max(0, keys.length - 40))) delete iconCache[k];
    try { localStorage.setItem(ICONS_KEY, JSON.stringify(iconCache)); } catch {}
  }
  const normTitle = (t) => String(t || "").replace(/^\(\d+\+?\)\s*/, "").replace(/\s+/g, " ").trim().toLowerCase();
  function iconFor(title, extra) {
    if (extra?.[title]) return extra[title];
    const n = normTitle(title);
    return tabList.find((t) => t.title === title)?.icon || iconCache[title] || tabList.find((t) => t.icon && normTitle(t.title) === n)?.icon || Object.entries(iconCache).find(([k]) => normTitle(k) === n)?.[1] || null;
  }
  const urlFor = (title) => tabList.find((t) => t.title === title || normTitle(t.title) === normTitle(title))?.url || "";
  // a muted, stable colour for sites without a favicon
  function hashColor(s) {
    let h = 0;
    for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const hue = h % 360, sat = 0.32, l = 0.5;
    const a = sat * Math.min(l, 1 - l), f = (n) => { const k = (n + hue / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
    return `${f(0)} ${f(8)} ${f(4)}`;
  }
  const colorCache = new Map();
  function dominantColor(img) {
    try {
      const c = document.createElement("canvas");
      c.width = c.height = 24;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(img, 0, 0, 24, 24);
      const d = g.getImageData(0, 0, 24, 24).data;
      const buckets = new Map();
      let greyN = 0, grey = 0;
      for (let i = 0; i < d.length; i += 4) {
        const [r, gg, b, al] = [d[i], d[i + 1], d[i + 2], d[i + 3]];
        if (al < 140) continue;
        const max = Math.max(r, gg, b), min = Math.min(r, gg, b);
        if ((max === 0 ? 0 : (max - min) / max) < 0.25 || max < 80) { greyN++; grey += (r + gg + b) / 3; continue; }
        const key = `${r >> 5},${gg >> 5},${b >> 5}`;
        const e = buckets.get(key) || { n: 0, r: 0, g: 0, b: 0 };
        e.n++; e.r += r; e.g += gg; e.b += b;
        buckets.set(key, e);
      }
      const best = [...buckets.values()].sort((x, y) => y.n - x.n)[0];
      if (best && best.n >= 4) return `${Math.round(best.r / best.n)} ${Math.round(best.g / best.n)} ${Math.round(best.b / best.n)}`;
      if (greyN) return grey / greyN > 128 ? "150 152 160" : "dark";
    } catch {}
    return null;
  }
  function paintChips(root = document) {
    for (const chip of root.querySelectorAll(".chip:not([data-painted])")) {
      const img = chip.querySelector("img");
      if (!img) { chip.dataset.painted = "1"; continue; }
      const apply = () => {
        let rgb = colorCache.get(img.src);
        if (rgb === undefined) { rgb = dominantColor(img); colorCache.set(img.src, rgb); }
        if (rgb === "dark") { chip.dataset.dark = "1"; rgb = "120 124 134"; }
        if (rgb) chip.style.setProperty("--chip", rgb);
        chip.dataset.painted = "1";
      };
      if (img.complete && img.naturalWidth) apply();
      else img.addEventListener("load", apply, { once: true });
    }
  }
  function chipLabel(title) {
    let t = String(title).replace(/^\(\d+\+?\)\s*/, "").trim();
    const m = t.match(/^(.{6,}?)\s+[-–—|·]\s+[^-–—|·]{2,30}$/);
    return m ? m[1] : t;
  }
  function chipHTML(title, removable = false, icons = null) {
    const icon = iconFor(title, icons);
    const letter = (title.replace(/^\(\d+\+?\)\s*/, "").match(/[\p{L}\p{N}]/u)?.[0] || "?").toUpperCase();
    const known = icon && colorCache.get(icon);
    const style = icon ? (known && known !== "dark" ? ` style="--chip:${known}"` : "") : ` style="--chip:${hashColor(urlFor(title).replace(/^https?:\/\//, "").split("/")[0] || normTitle(title))}"`;
    const ic = icon ? `<img src="${esc(icon)}" alt="" onerror="this.outerHTML='<span class=letter>${esc(letter)}</span>'">` : `<span class="letter">${esc(letter)}</span>`;
    return `<span class="chip" contenteditable="false" data-title="${esc(title)}" title="${esc(title)}"${style}${icon && known ? ` data-painted="1"${known === "dark" ? " data-dark" : ""}` : ""}>${ic}<span class="t">${esc(chipLabel(title))}</span>${removable ? `<button class="x" tabindex="-1" type="button" aria-label="Remove">${ICON.x}</button>` : ""}</span>`;
  }
  // "goal: …" shows as a Goal tag in lists instead of command syntax
  const richText = (text, icons = null) => {
    const m = String(text ?? "").match(/^(goal|task|do)\s*:\s*/i);
    const body = m ? String(text).slice(m[0].length) : String(text ?? "");
    return (m ? '<span class="tag">Goal</span>' : "") + body.split(/@\[([^\]]+)\]/g).map((p, i) => (i % 2 ? chipHTML(p, false, icons) : esc(p))).join("");
  };
  function composerIcons() {
    const out = {};
    for (const chip of cmd.querySelectorAll(".chip")) {
      const src = chip.querySelector("img")?.getAttribute("src");
      if (src) out[chip.dataset.title] = src;
    }
    return out;
  }
  function cmdText() {
    let out = "";
    for (const n of cmd.childNodes) {
      if (n.nodeType === 3) out += n.nodeValue;
      else if (n.classList?.contains("chip")) out += ` @[${n.dataset.title}] `;
      else out += n.textContent || "";
    }
    return out.replace(/ /g, " ").replace(/\s+/g, " ").replace(/\]\s+([,.;:!?])/g, "]$1").trim();
  }
  function caretToEnd() {
    if (cmd.contentEditable !== "true") return;
    cmd.focus();
    const r = document.createRange();
    r.selectNodeContents(cmd);
    r.collapse(false);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }
  function setCmd(text) {
    cmd.innerHTML = text ? String(text).split(/@\[([^\]]+)\]/g).map((p, i) => (i % 2 ? chipHTML(p, true) : esc(p))).join("") : "";
    paintChips(cmd);
    if (cmd.lastChild && cmd.lastChild.nodeType !== 3) cmd.appendChild(document.createTextNode(" "));
    syncGo();
    caretToEnd();
  }
  function setEnabled(on) {
    cmd.contentEditable = on ? "true" : "false";
    cmd.classList.toggle("off", !on);
    syncGo();
  }
  function syncGo() {
    const has = Boolean(cmdText());
    $("go").disabled = !has || cmd.contentEditable !== "true";
    $("go").classList.toggle("ready", has);
  }
  function tidy() {
    if (!cmd.querySelector(".chip") && !cmd.textContent.replace(/ /g, " ").trim()) cmd.innerHTML = "";
  }
  function submit() {
    const text = cmdText();
    if (!text || text.startsWith("/")) return; // "/…" searches history, it doesn't run
    const icons = composerIcons();
    setCmd("");
    closeMentions();
    run(text, { icons });
    recall = -1;
  }
  $("form").addEventListener("submit", (e) => { e.preventDefault(); submit(); });

  // ── "@": open tabs ──────────────────────────────────────
  function mentionAtCursor() {
    const sel = getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return null;
    const node = sel.anchorNode;
    if (!node || node.nodeType !== 3 || !cmd.contains(node)) return null;
    const upto = node.nodeValue.slice(0, sel.anchorOffset);
    const m = upto.match(/(?:^|[\s(,; ])@([^\s@,; ]*)$/);
    if (!m) return null;
    return { node, start: sel.anchorOffset - m[1].length - 1, query: m[1] };
  }
  const mentionMatches = () => {
    const q = (mention?.query || "").toLowerCase();
    return tabList.filter((t) => !q || `${t.title} ${t.url}`.toLowerCase().includes(q)).slice(0, 12);
  };
  function closeMentions() { mention = null; $("mentions").hidden = true; }
  function renderMentions() {
    const box = $("mentions");
    if (!mention) return (box.hidden = true);
    const items = mentionMatches();
    mentionSel = Math.min(mentionSel, Math.max(0, items.length - 1));
    box.style.top = `${$("form").getBoundingClientRect().bottom - 6}px`;
    box.innerHTML = items.length
      ? items.map((t, i) => {
          const letter = ((t.title || "").replace(/^\(\d+\+?\)\s*/, "").match(/[\p{L}\p{N}]/u)?.[0] || "?").toUpperCase();
          const ic = t.icon ? `<img src="${esc(t.icon)}" alt="">` : `<span class="letter" style="--chip:${hashColor(t.url.replace(/^https?:\/\//, "").split("/")[0] || t.title)}">${esc(letter)}</span>`;
          return `<div class="mention${i === mentionSel ? " on" : ""}" role="option" aria-selected="${i === mentionSel}" data-i="${i}"><span class="ic">${ic}</span><span class="t">${esc(t.title || "Untitled")}${t.active ? '<span class="cur">Current tab</span>' : ""}</span><span class="u">${esc(shortUrl(t.url))}</span></div>`;
        }).join("")
      : `<div class="none">${tabList.length ? "No open tab matches." : "No tabs are open in the controlled browser."}</div>`;
    box.hidden = false;
    box.querySelector(".mention.on")?.scrollIntoView({ block: "nearest" });
  }
  function pickMention(i) {
    const t = mentionMatches()[i];
    const at = mentionAtCursor() || mention;
    if (!t || !at) return closeMentions();
    const title = (t.title || shortUrl(t.url)).replace(/[\[\]]/g, "");
    rememberIcon(title, t.icon);
    const sel = getSelection();
    const range = document.createRange();
    range.setStart(at.node, at.start);
    range.setEnd(at.node, sel.anchorNode === at.node ? sel.anchorOffset : at.start + 1 + at.query.length);
    range.deleteContents();
    const tpl = document.createElement("template");
    tpl.innerHTML = chipHTML(title, true);
    const chip = tpl.content.firstChild;
    range.insertNode(chip);
    paintChips(cmd);
    let after = chip.nextSibling;
    if (!after || after.nodeType !== 3) { after = document.createTextNode(" "); chip.after(after); }
    else if (!/^[\s ]/.test(after.nodeValue)) after.nodeValue = " " + after.nodeValue;
    const r = document.createRange();
    r.setStart(after, 1);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
    closeMentions();
    syncGo();
    cmd.focus();
  }
  function updateMention() {
    mention = mentionAtCursor();
    if (!mention) return closeMentions();
    if (Date.now() - tabListAt > 2000) { tabListAt = Date.now(); send({ type: "tabs:list" }); }
    renderMentions();
  }
  cmd.addEventListener("input", () => { tidy(); syncGo(); updateMention(); if (tab !== "secrets") render(); });
  cmd.addEventListener("click", updateMention);
  cmd.addEventListener("blur", () => setTimeout(closeMentions, 150));
  cmd.addEventListener("mousedown", (e) => {
    const x = e.target.closest(".chip .x");
    if (!x) return;
    e.preventDefault();
    const chip = x.closest(".chip");
    const next = chip.nextSibling;
    if (next?.nodeType === 3) next.nodeValue = next.nodeValue.replace(/^[\s ]/, "");
    chip.remove();
    tidy();
    cmd.dispatchEvent(new Event("input"));
    cmd.focus();
  });
  cmd.addEventListener("paste", (e) => {
    e.preventDefault();
    document.execCommand("insertText", false, (e.clipboardData?.getData("text/plain") || "").replace(/\s*\n\s*/g, " "));
  });
  $("mentions").addEventListener("mousedown", (e) => {
    const it = e.target.closest(".mention");
    if (it) { e.preventDefault(); pickMention(Number(it.dataset.i)); }
  });
  // the tab list, while open, owns the arrow keys / Enter / Tab / Esc
  cmd.addEventListener("keydown", (e) => {
    if ($("mentions").hidden || !mention) return;
    const n = mentionMatches().length;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { mentionSel = n ? (mentionSel + (e.key === "ArrowDown" ? 1 : -1) + n) % n : 0; renderMentions(); }
    else if ((e.key === "Enter" || e.key === "Tab") && n) pickMention(mentionSel);
    else if (e.key === "Escape") closeMentions();
    else return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);
  cmd.addEventListener("keydown", (e) => {
    const empty = !cmdText();
    if (e.key === "Enter") {
      e.preventDefault();
      if (empty && prompt?.primary) return prompt.primary();
      return submit();
    }
    if (empty && prompt?.numbered && /^[1-9]$/.test(e.key)) { e.preventDefault(); return prompt.numbered[Number(e.key) - 1]?.(); }
    if (e.key === "ArrowDown" && cmdText().startsWith("/")) {
      const first = $("activity").querySelector(".row");
      if (first) { e.preventDefault(); first.focus(); }
      return;
    }
    if (e.key === "ArrowDown" && recall < 0 && empty) {
      const first = $("activity").querySelector(".row");
      if (first) { e.preventDefault(); first.focus(); }
      return;
    }
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    const texts = [...new Set(history.flatMap((h) => [...(h.turns || []).map((t) => t.text).reverse(), h.text]))];
    if (!texts.length || (!empty && recall < 0)) return;
    e.preventDefault();
    recall = e.key === "ArrowUp" ? Math.min(recall + 1, texts.length - 1) : Math.max(recall - 1, -1);
    setCmd(recall < 0 ? "" : texts[recall]);
  });

  // global keys: Esc stops / cancels / hides; ⌘1-3 switch views
  document.addEventListener("keydown", (e) => {
    if (recording) return;
    if (e.metaKey && /^[123]$/.test(e.key)) { e.preventDefault(); return selectTab(["recent", "saved", "secrets"][Number(e.key) - 1]); }
    if (e.key !== "Escape" || e.defaultPrevented) return;
    e.preventDefault();
    if (prompt?.cancel) return prompt.cancel();
    if (busy) return stopAll();
    if (document.activeElement?.closest?.(".row, .field")) return caretToEnd();
    if (replyTo) return clearReply();
    if ($("status").classList.contains("on")) return clearStatus();
    window.bar.hide();
  });

  // ── shortcut recording ──────────────────────────────────
  const SYM = { Command: "⌘", CommandOrControl: "⌘", Control: "⌃", Alt: "⌥", Shift: "⇧" };
  const showHotkey = (accel) => { $("hotkey-keys").textContent = (accel || "None").split("+").map((k) => SYM[k] || (k.length === 1 ? k.toUpperCase() : k)).join(""); };
  function keyName(e) {
    const c = e.code;
    if (/^Key[A-Z]$/.test(c)) return c.slice(3);
    if (/^Digit\d$/.test(c)) return c.slice(5);
    if (/^F\d{1,2}$/.test(c)) return c;
    const map = { Space: "Space", Enter: "Enter", Tab: "Tab", Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Backslash: "\\", Semicolon: ";", Quote: "'", Comma: ",", Period: ".", Slash: "/", ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right" };
    return map[c] || null;
  }
  let recording = false;
  function stopRecording() {
    recording = false;
    $("hotkey").classList.remove("recording");
    window.bar.pauseHotkey(false);
    document.removeEventListener("keydown", onRecordKey, true);
  }
  async function onRecordKey(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.key === "Escape") { stopRecording(); showHotkey(await window.bar.getHotkey()); setStatus("Shortcut unchanged.", "info"); return; }
    if (["Meta", "Control", "Alt", "Shift"].includes(e.key)) return;
    const key = keyName(e);
    const mods = [e.metaKey && "Command", e.ctrlKey && "Control", e.altKey && "Alt", e.shiftKey && "Shift"].filter(Boolean);
    if (!key || (!mods.length && !/^F\d/.test(key)) || (mods.length === 1 && mods[0] === "Shift")) {
      setStatus("Use ⌘, ⌃ or ⌥ together with a key. Press Esc to cancel.", "warn");
      return;
    }
    stopRecording();
    const r = await window.bar.setHotkey([...mods, key].join("+"));
    showHotkey(r.hotkey);
    setStatus(r.ok ? `Shortcut set to ${$("hotkey-keys").textContent}.` : r.error, r.ok ? "ok" : "err");
  }
  function recordHotkey() {
    if (recording) return;
    recording = true;
    $("hotkey").classList.add("recording");
    $("hotkey-keys").textContent = "Press keys…";
    setStatus("Press the new shortcut. Esc cancels.", "info");
    window.bar.pauseHotkey(true);
    document.addEventListener("keydown", onRecordKey, true);
  }
  $("hotkey").onclick = recordHotkey;
  window.bar.getHotkey().then(showHotkey);

  // ── controlled browser ──────────────────────────────────
  const shortName = (b) => (b.id === "builtin" ? "Built-in Chromium" : `${b.name.replace(/^Google |^Microsoft /, "")}${b.separate ? " (own profile)" : ""}`);
  function showBrowser(b) {
    browserBusy = Boolean(b.busy);
    if (!b.busy) $("browser-ic").innerHTML = b.icon ? `<img src="${esc(b.icon)}" alt="">` : ICON.globe;
    $("browser-name").textContent = b.busy ? "Switching…" : shortName(b);
    $("browser").dataset.state = b.busy ? "off" : "on";
    if (b.busy) setStatus(b.busy, "busy");
    else if (b.error) setStatus(b.error, "err");
    else if (b.note) setStatus(b.note, "warn");
  }
  window.bar.onBrowserState((b) => {
    showBrowser(b);
    if (!b.busy && !b.error) setStatus(b.id === "builtin" ? "Controlling the built-in Chromium." : `Connected to ${b.name}.${b.separate ? " It uses its own profile, so sign in there once." : ""}`, "ok");
  });
  window.bar.onBrowserConfirm((b) => {
    const short = b.name.replace(/^Google |^Microsoft /, "");
    const cancel = { label: "Cancel", action: () => { clearStatus(); caretToEnd(); } };
    if (b.ownProfile || b.separate) {
      setStatus(`${b.name} can only be controlled in a separate profile. Your main window stays as it is.`, "warn", [{ label: `Open ${short}`, primary: true, action: () => window.bar.switchBrowser(b.id) }, cancel]);
    } else {
      setStatus(`Quit ${b.name} and reopen it so Voice Browser can control it? Your tabs come back.`, "warn", [{ label: `Restart ${short}`, primary: true, action: () => window.bar.switchBrowser(b.id) }, cancel]);
    }
  });
  $("browser").onclick = () => window.bar.browserMenu();
  $("more").onclick = () => window.bar.appMenu({ model });
  window.bar.onMenuAction?.((a) => {
    if (a === "undo") send({ type: "undo" });
    else if (a === "record-hotkey") recordHotkey();
  });
  window.bar.onFocusInput(() => caretToEnd());
  window.bar.onServerExit((info) => setStatus(`The browser service stopped (code ${info.code}).`, "err"));

  render();
  (async () => {
    setStatus("Starting the browser", "busy");
    const r = await window.bar.ensureServer();
    window.bar.getBrowser().then(showBrowser);
    if (!r.ok) setStatus(r.error, "warn");
    else clearStatus();
    connect(); // keeps retrying until the service is up
  })();
</script>
</body>
</html>
