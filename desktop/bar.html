<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ws://127.0.0.1:*; img-src 'self' data:" />
<title>Voice Browser</title>
<style>
  /*
   * Voice Browser chat panel.
   * Restrained: cool-tinted neutrals, one accent (the user's macOS accent colour) for focus, caret,
   * send and selection only. Status colours always come with an icon or a word.
   * Type: SF Pro, 11 / 12 / 13 / 14 / 15 / 20. Radii: 6 small, 8 controls, 10 popovers, 18 bubbles.
   */
  :root {
    color-scheme: light dark;
    --surface: rgb(247 247 249 / .96);
    --raised: #ffffff;
    --sunken: rgb(18 20 28 / .045);
    --bubble: rgb(18 20 28 / .065);
    --text: #1b1c20;
    --text-2: #4f525a;
    --text-3: #676a72;
    --hair: rgb(18 20 28 / .09);
    --hover: rgb(18 20 28 / .05);
    --press: rgb(18 20 28 / .09);
    --ok: #17773d;
    --warn: #8f5400;
    --err: #b8322a;
    --accent: #0a63d6;
    --accent-fill: #0a63d6;
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgb(18 20 40 / .06), 0 10px 28px rgb(18 20 40 / .14);
    --ease: cubic-bezier(.25, 1, .5, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: rgb(22 23 26 / .97);
      --raised: #2a2b30;
      --sunken: rgb(255 255 255 / .045);
      --bubble: rgb(255 255 255 / .085);
      --text: #ececef;
      --text-2: #b9bac0;
      --text-3: #9a9ca3;
      --hair: rgb(255 255 255 / .08);
      --hover: rgb(255 255 255 / .06);
      --press: rgb(255 255 255 / .1);
      --ok: #5fd28b;
      --warn: #f2b45a;
      --err: #ff8478;
      --accent: #4c9dff;
      --accent-fill: #1f6fd6;
      --on-accent: #ffffff;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .42);
    }
  }
  /* Liquid Glass (macOS 26+): the window itself is glass; the page lets it through and layers
     lighter frosted surfaces on top for the composer and bubbles. */
  html.glass { --surface: transparent; --bubble: rgb(255 255 255 / .5); --raised: rgb(255 255 255 / .62); --sunken: rgb(18 20 28 / .05); }
  @media (prefers-color-scheme: dark) {
    html.glass { --bubble: rgb(255 255 255 / .1); --raised: rgb(255 255 255 / .08); --sunken: rgb(255 255 255 / .06); }
  }
  html.glass .box { backdrop-filter: saturate(1.4); box-shadow: inset 0 0 0 1px var(--hair), 0 1px 3px rgb(0 0 0 / .05); }
  html.glass .mentions { background: rgb(250 250 252 / .9); backdrop-filter: blur(24px) saturate(1.6); }
  @media (prefers-color-scheme: dark) { html.glass .mentions { background: rgb(38 39 44 / .92); } }
  html.glass .row .acts-row { background: none; }
  html.glass .act { background: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  html { background: var(--surface); }
  body {
    display: flex; flex-direction: column;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
  ol, ul { list-style: none; }
  svg { display: block; flex: none; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  kbd {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
    font: 500 11px/1 -apple-system, system-ui, sans-serif; color: var(--text-2);
    background: var(--sunken); border-radius: 5px; box-shadow: inset 0 0 0 1px var(--hair);
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .spacer { flex: 1; }

  /* ── header (drag handle) ─────────────────────────────── */
  .top { -webkit-app-region: drag; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; flex: none; }
  .pill, .icon { -webkit-app-region: no-drag; transition: background .15s var(--ease), color .15s var(--ease); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; max-width: 200px; min-width: 0; padding: 0 7px 0 6px;
    border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--text-2);
  }
  .pill:hover { background: var(--hover); color: var(--text); }
  .pill:active { background: var(--press); }
  .pill .b-ic { width: 16px; height: 16px; display: grid; place-items: center; color: var(--text-3); flex: none; }
  .pill .b-ic img { width: 16px; height: 16px; }
  .pill .b-ic svg { width: 15px; height: 15px; }
  .pill .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .caret { width: 11px; height: 11px; color: var(--text-3); flex: none; }
  .pill[data-state="off"] .name { color: var(--warn); }
  .tabpill { color: var(--text); flex: 0 1 auto; }
  .tabpill .b-ic img, .tabpill .b-ic .letter { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; }
  .tabpill .b-ic .letter { display: grid; place-items: center; font: 700 10px/1 -apple-system, system-ui, sans-serif; color: #fff; background: rgb(var(--chip)); }
  .browserpill .name { max-width: 90px; }
  .icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); flex: none; }
  .icon:hover { background: var(--hover); color: var(--text); }
  .icon:active { background: var(--press); }
  .icon svg { width: 16px; height: 16px; }

  /* ── chat ───────────────────────────────────────────── */
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 4px; }
  .msg { display: flex; flex-direction: column; min-width: 0; }
  .msg[data-new] { animation: drop .2s var(--ease); }
  .msg.user { align-items: flex-end; }
  .msg.user + .msg.agent { margin-top: -4px; }
  .bubble {
    max-width: 82%; min-width: 0; padding: 9px 14px; border-radius: 18px; background: var(--bubble);
    font-size: 14px; line-height: 1.45; color: var(--text); white-space: pre-wrap; word-break: break-word; user-select: text;
  }
  .msg.user .mode { margin: 0 6px 3px 0; font-size: 11px; color: var(--text-3); display: inline-flex; align-items: center; gap: 3px; }
  .msg.user .mode svg { width: 11px; height: 11px; }
  .msg.user .urow { display: flex; align-items: center; justify-content: flex-end; gap: 4px; max-width: 100%; }
  .msg.user .uacts { display: flex; gap: 0; opacity: 0; transition: opacity .12s var(--ease); flex: none; }
  .msg.user:hover .uacts, .msg.user:focus-within .uacts { opacity: 1; }
  .msg.agent { align-items: flex-start; padding-right: 8px; }
  .msg.agent .text { font-size: 14px; line-height: 1.5; color: var(--text); white-space: pre-wrap; word-break: break-word; user-select: text; }
  .msg.agent.fail .text { color: var(--text); }
  .msg.agent .failhead { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 12px; font-weight: 500; color: var(--err); }
  .msg.agent .failhead svg { width: 13px; height: 13px; }
  .msg.agent .note { margin-top: 4px; font-size: 12px; color: var(--text-3); }
  .understood { margin-bottom: 6px; font-size: 12px; color: var(--text-3); }
  .understood b { font-weight: 500; margin-right: 4px; }
  /* direct mode: one quiet line */
  .msg.agent.direct .text { font-size: 13px; color: var(--text-2); display: flex; gap: 6px; align-items: baseline; }
  .msg.agent.direct .dcost { margin-left: 8px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .msg.agent.direct .text .mk { display: inline-grid; place-items: center; width: 14px; height: 14px; flex: none; position: relative; top: 2px; }
  .msg.agent.direct .text .mk svg { width: 13px; height: 13px; }
  .msg.agent.direct.ok .mk { color: var(--ok); } .msg.agent.direct.fail .mk { color: var(--err); } .msg.agent.direct.ignored .mk { color: var(--text-3); }

  /* working: three dots, then what it's doing now */
  .working { display: flex; align-items: center; gap: 10px; min-height: 22px; font-size: 13px; color: var(--text-2); }
  .dots { display: inline-flex; gap: 4px; flex: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: blink 1.2s infinite ease-in-out both; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  .working .now { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .steps { margin: 8px 0 2px; display: flex; flex-direction: column; gap: 3px; padding-left: 2px; border-left: 2px solid var(--hair); }
  .step { display: grid; grid-template-columns: 16px 1fr; gap: 6px; align-items: start; padding-left: 8px; font-size: 12px; color: var(--text-2); }
  .step .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step small { margin-left: 6px; font-size: 11px; color: var(--text-3); }
  .step.running { color: var(--text); }
  .step.pending { color: var(--text-3); }
  .mark { width: 16px; height: 16px; display: grid; place-items: center; color: var(--text-3); }
  .mark svg { width: 12px; height: 12px; }
  .mark.ok { color: var(--ok); } .mark.fail { color: var(--err); } .mark.awaiting { color: var(--warn); }
  .mark.pending::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); }
  .mark .spin { width: 11px; height: 11px; }

  /* under a reply: steps toggle, cost, actions */
  .meta { display: flex; align-items: center; gap: 2px; margin-top: 6px; min-height: 24px; font-size: 12px; color: var(--text-3); }
  .meta .info { padding: 0 6px 0 0; font-variant-numeric: tabular-nums; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .act.tog { white-space: nowrap; flex: none; }
  .act { height: 24px; min-width: 24px; padding: 0 5px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--text-3); font-size: 12px; }
  .act:hover { background: var(--hover); color: var(--text); }
  .act svg { width: 14px; height: 14px; }
  .act.tog svg { width: 10px; height: 10px; transition: transform .15s var(--ease); }
  .act.tog[aria-expanded="true"] svg { transform: rotate(90deg); }
  .msg.agent .meta .hov { opacity: 0; transition: opacity .12s var(--ease); }
  .msg.agent:hover .meta .hov, .msg.agent:focus-within .meta .hov, .msg.agent:last-child .meta .hov { opacity: 1; }

  /* screenshots the agent sends */
  .shots { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; align-self: stretch; }
  .shot { position: relative; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--hair), 0 1px 3px rgb(0 0 0 / .08); background: var(--sunken); }
  .shot img { display: block; width: 100%; max-height: 300px; object-fit: cover; object-position: top; cursor: zoom-in; }
  .shot .gone { display: flex; align-items: center; gap: 8px; padding: 12px; font-size: 12px; color: var(--text-2); cursor: default; }
  .shot .gone svg { width: 16px; height: 16px; color: var(--text-3); }
  .shot .sacts { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .12s var(--ease); }
  .shot:hover .sacts, .shot:focus-within .sacts { opacity: 1; }
  .shot .sacts button { height: 26px; padding: 0 9px; border-radius: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: #fff; background: rgb(20 20 24 / .72); backdrop-filter: blur(10px); }
  .shot .sacts button:hover { background: rgb(20 20 24 / .88); }
  .shot .sacts svg { width: 13px; height: 13px; }

  /* consent / choice, inline in the reply */
  .ask {
    margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--raised); align-self: stretch;
    box-shadow: inset 0 0 0 1px var(--hair), 0 1px 2px rgb(0 0 0 / .05); animation: drop .18s var(--ease);
  }
  .ask p { font-size: 13px; color: var(--text); }
  .ask .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }

  /* empty chat */
  .hello { margin: auto 0; padding: 12px 4px 4px; }
  .hello h1 { font: 600 20px/1.25 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; letter-spacing: -.015em; color: var(--text); }
  .hello p { margin-top: 6px; font-size: 13px; color: var(--text-2); }
  .hello .ex { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
  .example { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--text); text-align: left; }
  .example:hover, .example:focus-visible { background: var(--hover); }
  .example svg { width: 14px; height: 14px; color: var(--text-3); }
  .hello .keys { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: var(--text-3); }
  .hello .keys span { display: inline-flex; align-items: center; gap: 6px; }

  /* ── tab chips: favicon + short title, tinted with the site's own colour ── */
  .chip {
    display: inline-flex; align-items: center; gap: 5px; vertical-align: middle; position: relative; top: -1px;
    height: 22px; max-width: 200px; padding: 0 8px 0 5px; margin: 0 1px; border-radius: 7px;
    font: 500 13px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--text);
    background: rgb(var(--chip, 120 124 134) / .13); box-shadow: inset 0 0 0 1px rgb(var(--chip, 120 124 134) / .30);
    user-select: none; white-space: nowrap; animation: pop .14s var(--ease);
  }
  .chip img, .chip .letter { width: 14px; height: 14px; flex: none; border-radius: 3px; object-fit: contain; }
  .chip .letter { display: grid; place-items: center; font: 700 9px/1 -apple-system, system-ui, sans-serif; color: #fff; background: rgb(var(--chip, 120 124 134)); }
  .chip .t { overflow: hidden; text-overflow: ellipsis; }
  .chip .x { display: grid; place-items: center; width: 16px; height: 16px; margin: 0 -4px 0 -2px; border-radius: 50%; color: var(--text-2); opacity: 0; transition: opacity .12s var(--ease); }
  .chip:hover .x { opacity: 1; }
  .chip .x:hover { background: var(--press); }
  .chip .x svg { width: 9px; height: 9px; }
  .bubble .chip { animation: none; }
  @media (prefers-color-scheme: dark) { .chip[data-dark] img { background: #ececf0; padding: 1px; } }

  /* ── status: only present when something needs saying outside a reply ── */
  .status {
    display: none; align-items: center; gap: 8px; min-height: 34px; margin: 0 12px 6px; padding: 6px 10px; flex: none;
    font-size: 12px; color: var(--text-2); border-radius: 10px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--hair);
  }
  .status.on { display: flex; animation: drop .16s var(--ease); }
  .status .ic { width: 15px; height: 15px; display: grid; place-items: center; }
  .status .ic svg { width: 15px; height: 15px; }
  .status.ok .ic { color: var(--ok); } .status.warn .ic { color: var(--warn); } .status.err .ic { color: var(--err); }
  .status.err .msgt { color: var(--text); }
  .status .msgt { min-width: 0; flex: 1; line-height: 1.35; }
  .status .acts { display: flex; gap: 6px; flex: none; }
  .spin { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--hair); border-top-color: var(--text-2); animation: spin .8s linear infinite; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px;
    font-size: 12px; font-weight: 500; color: var(--text); background: var(--hover); box-shadow: inset 0 0 0 1px var(--hair);
    white-space: nowrap; transition: background .15s var(--ease), transform .1s var(--ease);
  }
  .btn:hover { background: var(--press); }
  .btn:active { transform: scale(.97); }
  .btn.primary { color: var(--on-accent); background: var(--accent-fill); box-shadow: none; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn kbd { height: 16px; min-width: 16px; font-size: 10px; background: transparent; box-shadow: inset 0 0 0 1px currentColor; color: inherit; opacity: .7; }
  .btn .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-2); }
  .btn svg { width: 13px; height: 13px; }
  .link svg { width: 13px; height: 13px; }
  .link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-2); padding: 3px 6px; border-radius: 6px; text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
  .link:hover { color: var(--text); background: var(--hover); }

  /* ── composer ───────────────────────────────────────── */
  .box {
    margin: 0 10px 10px; padding: 10px 10px 8px 14px; flex: none; border-radius: 18px;
    background: var(--raised); box-shadow: inset 0 0 0 1px var(--hair), 0 1px 3px rgb(0 0 0 / .06);
    transition: box-shadow .15s var(--ease);
  }
  .box:focus-within { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, var(--hair)), 0 1px 3px rgb(0 0 0 / .06); }
  .composer {
    -webkit-app-region: no-drag; min-height: 24px; max-height: 120px; overflow-y: auto; scrollbar-width: none;
    font: 400 15px/24px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--text); white-space: pre-wrap; word-break: break-word;
    outline: none; user-select: text; cursor: text; caret-color: var(--accent);
  }
  .composer::-webkit-scrollbar { display: none; }
  .composer:empty::before { content: attr(data-placeholder); color: var(--text-3); pointer-events: none; }
  .composer.off { opacity: .5; cursor: default; }
  .tools { display: flex; align-items: center; gap: 4px; margin-top: 6px; margin-left: -6px; }
  .tool { -webkit-app-region: no-drag; height: 28px; min-width: 28px; padding: 0 6px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: var(--text-2); font-size: 12px; font-weight: 500; }
  .tool:hover { background: var(--hover); color: var(--text); }
  .tool svg { width: 16px; height: 16px; }
  .modes { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--hair); }
  .modes button { height: 24px; padding: 0 9px; border-radius: 7px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-3); }
  .modes button svg { width: 12px; height: 12px; }
  .modes button:hover { color: var(--text-2); }
  .modes button[aria-checked="true"] { color: var(--text); background: var(--raised); box-shadow: 0 0 0 1px var(--hair), 0 1px 2px rgb(0 0 0 / .08); }
  .modelpick { color: var(--text-3); gap: 5px; padding: 0 5px 0 6px; min-width: 0; }
  .modelpick[aria-expanded="true"] { background: var(--hover); color: var(--text); }
  .modelpick .lg { width: 14px; height: 14px; display: grid; place-items: center; color: var(--text-2); }
  .modelpick .lg svg { width: 14px; height: 14px; }

  /* ── model picker (opens above the composer) ─────────── */
  .picker {
    position: fixed; left: 10px; right: 10px; z-index: 11; max-height: min(440px, calc(100vh - 150px)); overflow-y: auto; padding: 6px;
    border-radius: 14px; background: var(--raised); box-shadow: var(--shadow), inset 0 0 0 1px var(--hair);
    transform-origin: bottom; animation: menu .14s var(--ease);
  }
  .pk-head { padding: 6px 10px 4px; font-size: 11px; font-weight: 600; color: var(--text-3); }
  .pk-row { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 1px 10px; width: 100%; padding: 7px 10px; border-radius: 9px; text-align: left; }
  .pk-row.on { background: var(--hover); }
  .pk-row .lg { grid-row: 1 / 3; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--text); background: var(--sunken); box-shadow: inset 0 0 0 1px var(--hair); }
  .pk-row .lg svg { width: 15px; height: 15px; }
  .pk-row .t { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pk-row .s { grid-column: 2; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pk-row .s .rest { color: var(--warn); }
  .pk-row .ck { grid-row: 1 / 3; grid-column: 3; width: 16px; color: var(--accent); }
  .pk-row .ck svg { width: 14px; height: 14px; }
  .pk-row.add .t { color: var(--text-2); }
  .pk-row .lg.app { background: none; box-shadow: none; }
  .pk-row .lg.app img { width: 24px; height: 24px; }
  .picker.below { transform-origin: top; }
  .pk-sep { height: 1px; margin: 5px 6px; background: var(--hair); }
  .pk-form { display: flex; gap: 6px; align-items: center; padding: 2px 10px 8px 44px; animation: drop .14s var(--ease); }
  .pk-form .field { height: 26px; }
  html.glass .picker { background: rgb(250 250 252 / .9); backdrop-filter: blur(24px) saturate(1.6); }
  @media (prefers-color-scheme: dark) { html.glass .picker { background: rgb(38 39 44 / .92); } }
  .modelpick .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .modelpick { flex: 0 1 auto; }
  .tools { container-type: inline-size; }
  /* narrow panels: the mode switch drops to icons so the model's full name fits */
  @container (max-width: 380px) {
    .modes button span { display: none; }
    .modes button { padding: 0 7px; }
    .modes button svg { width: 14px; height: 14px; }
  }
  .modelpick .caret svg { width: 10px; height: 10px; }
  .spend { -webkit-app-region: no-drag; white-space: nowrap; flex: none; display: inline-flex; align-items: center; height: 24px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-3); }
  .spend:hover { background: var(--hover); color: var(--text-2); }
  .spend.near { color: var(--warn); }
  .go {
    -webkit-app-region: no-drag; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
    color: var(--text-3); background: var(--sunken); transition: background .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
  }
  .go svg { width: 15px; height: 15px; }
  .go.ready { color: var(--on-accent); background: var(--accent-fill); }
  .go.ready:hover { filter: brightness(1.06); }
  .go.stop { color: var(--text); background: var(--press); }
  .go.stop svg { width: 12px; height: 12px; }
  .go:active { transform: scale(.94); }
  .go[disabled] { opacity: .45; }

  /* ── @ tab picker (opens above the composer) ─────────── */
  .mentions {
    position: fixed; left: 12px; right: 12px; z-index: 10; max-height: 280px; overflow-y: auto; padding: 5px;
    border-radius: 12px; background: var(--raised); box-shadow: var(--shadow), inset 0 0 0 1px var(--hair);
    transform-origin: bottom; animation: menu .14s var(--ease);
  }
  .mention { display: grid; grid-template-columns: 16px 1fr; gap: 1px 10px; align-items: center; padding: 6px 9px; border-radius: 8px; }
  .mention .ic { grid-row: 1 / 3; width: 16px; height: 16px; color: var(--text-3); }
  .mention .ic img, .mention .ic .letter { width: 16px; height: 16px; border-radius: 4px; }
  .mention .ic .letter { display: grid; place-items: center; font: 700 10px/1 -apple-system, system-ui, sans-serif; color: #fff; background: rgb(var(--chip)); }
  .mention .t { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mention .u { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mention .cur { font-size: 11px; margin-left: 8px; color: var(--text-3); }
  .mention.on { background: var(--accent-fill); }
  .mention.on .t, .mention.on .u, .mention.on .cur { color: var(--on-accent); }
  .mentions, .picker { backdrop-filter: blur(28px) saturate(1.7); }
  /* While a list is open, the conversation behind it blurs. backdrop-filter alone doesn't reach
     through Electron's transparent (glass) window, so the chat itself is blurred. */
  .chat { transition: filter .18s var(--ease), opacity .18s var(--ease); }
  body.veiled .chat { filter: blur(10px) saturate(1.15); opacity: .55; pointer-events: none; }
  .mentions .none, .mentions .head { padding: 6px 9px; font-size: 11px; color: var(--text-3); }

  /* ── side views: past chats, saved commands, passwords ── */
  .view { display: flex; flex-direction: column; gap: 2px; padding-top: 0; }
  .vhead { display: flex; align-items: center; gap: 6px; padding: 2px 0 8px; }
  .vhead h2 { font-size: 15px; font-weight: 600; color: var(--text); flex: 1; }
  .vhead .back { height: 26px; padding: 0 8px 0 4px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-2); }
  .vhead .back:hover { background: var(--hover); color: var(--text); }
  .vhead .back svg { width: 12px; height: 12px; transform: scaleX(-1); }
  .vnote { font-size: 12px; color: var(--text-2); padding: 0 2px 8px; }
  .row { position: relative; display: grid; grid-template-columns: 16px 1fr; gap: 0 10px; align-items: start; padding: 8px 10px; border-radius: 10px; }
  .row:hover, .row.on { background: var(--hover); }
  .row .rmark { width: 16px; height: 18px; display: grid; place-items: center; color: var(--text-3); }
  .row .rmark svg { width: 14px; height: 14px; }
  .row .main { min-width: 0; }
  .row .line { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .row .cmd { min-width: 0; flex: 1; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .time { flex: none; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .row .sub { margin-top: 2px; font-size: 12px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .acts-row { position: absolute; top: 5px; right: 6px; display: none; gap: 2px; padding-left: 12px; background: linear-gradient(90deg, transparent, var(--surface) 10px); }
  .row:hover > .acts-row, .row:focus-within > .acts-row { display: flex; }
  .name { font-weight: 600; }
  .empty { padding: 10px 2px; font-size: 13px; color: var(--text-2); }
  .tag { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--text-2); background: var(--sunken); box-shadow: inset 0 0 0 1px var(--hair); vertical-align: 1px; }
  .token { font: 500 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }
  .form { display: flex; gap: 6px; padding: 0 0 10px; animation: drop .16s var(--ease); }
  .field {
    -webkit-app-region: no-drag; user-select: text; height: 28px; min-width: 0; flex: 1; padding: 0 10px; border-radius: 8px;
    font: 13px -apple-system, system-ui, sans-serif; color: var(--text); background: var(--raised);
    border: 1px solid var(--hair); outline: none;
  }
  .field::placeholder { color: var(--text-3); }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .tbl { margin-top: 8px; max-width: 100%; overflow-x: auto; border: 1px solid var(--hair); border-radius: 8px; align-self: stretch; }
  .tbl table { border-collapse: collapse; font-size: 12px; width: 100%; user-select: text; }
  .tbl th, .tbl td { padding: 4px 8px; text-align: left; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--hair); }
  .tbl th { color: var(--text-2); font-weight: 600; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl .more { padding: 4px 8px; font-size: 11px; color: var(--text-3); }
  .hotkey.recording kbd { color: var(--on-accent); background: var(--accent-fill); box-shadow: none; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drop { from { opacity: 0; transform: translateY(3px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  @keyframes menu { from { opacity: 0; transform: translateY(4px) scale(.99); } }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
    .spin { border-top-color: var(--text-3); border-style: dotted; }
    .dots i { opacity: .7; }
  }
  /* compact window: just the composer, and status when something is happening */
  @media (max-height: 200px) {
    .chat { display: none; }
    .top { height: 34px; }
  }
</style>
</head>
<body>
  <header class="top">
    <button class="icon" id="close" type="button" title="Hide (Esc)" aria-label="Hide"></button>
    <button class="pill tabpill" id="curtab" type="button" hidden title="The agent works in this tab. It follows the tab you switch to; click to pick another." aria-haspopup="listbox">
      <span class="b-ic" id="curtab-ic"></span><span class="name" id="curtab-name"></span><span class="caret" id="curtab-caret"></span>
    </button>
    <span class="spacer"></span>
    <button class="pill browserpill" id="browser" data-state="off" title="Choose the browser to control" aria-haspopup="listbox" aria-expanded="false">
      <span class="b-ic" id="browser-ic"></span><span class="name" id="browser-name">Connecting…</span><span class="caret" id="caret"></span>
    </button>
    <button class="icon" id="newchat" type="button" title="New chat (⌘N)" aria-label="New chat"></button>
    <button class="icon" id="more" type="button" title="More" aria-haspopup="menu" aria-label="More"></button>
  </header>

  <main class="chat" id="chat" aria-label="Conversation"></main>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="mentions" id="mentions" role="listbox" aria-label="Open tabs" hidden></div>
  <div class="picker" id="picker" role="listbox" aria-label="AI model" hidden></div>

  <form class="box" id="form">
    <div id="cmd" class="composer off" contenteditable="false" role="textbox" aria-label="Message" aria-multiline="true" spellcheck="false" data-placeholder="Ask anything, or tell it what to do"></div>
    <div class="tools">
      <button class="tool" id="at" type="button" title="Mention a tab (@)" aria-label="Mention a tab"></button>
      <div class="modes" role="radiogroup" aria-label="Mode" title="Switch with Tab">
        <button type="button" role="radio" data-mode="chat" aria-checked="true" title="Chat: plain-language requests and follow-ups, done step by step by the AI"></button>
        <button type="button" role="radio" data-mode="direct" aria-checked="false" title="Direct: instant one-step commands (scroll, click, next tab), no back-and-forth"></button>
      </div>
      <button class="tool modelpick" id="model" type="button" hidden title="AI model" aria-haspopup="listbox" aria-expanded="false"><span class="lg" id="model-logo"></span><span class="name" id="model-name">Auto</span><span class="caret" id="model-caret"></span></button>
      <span class="spacer"></span>
      <button class="spend" id="spend" type="button" hidden title="AI spending today. Click to set a daily limit."></button>
      <button class="go" id="go" type="submit" title="Send (Enter)" aria-label="Send" disabled></button>
    </div>
  </form>

  const CHATS_KEY = "vb.chats.v1";
  const chats = (() => {
    try {
      const list = JSON.parse(localStorage.getItem(CHATS_KEY) || "[]");
      for (const c of list) for (const m of c.msgs || []) {
        delete m.ask;
        if (m.status === "running") { m.status = "ignored"; m.detail = "Interrupted"; for (const s of m.steps || []) if (s.status === "running") s.status = "ignored"; }
      }
      return Array.isArray(list) ? list.filter((c) => c && c.id && Array.isArray(c.msgs)) : [];
    } catch { return []; }
  })();
  let activeId = localStorage.getItem("vb.chat") || null;
  const chat = () => {

  }

  function msgHTML(m) {
    const user = `<div class="msg user" data-id="${m.id}"${m.id === newId ? " data-new" : ""}>
      ${m.mode === "direct" ? `<span class="mode">${ICON.bolt}Direct</span>` : ""}
      <div class="urow"><div class="uacts"><button class="act" type="button" data-act="edit" title="Edit and send again" aria-label="Edit">${ICON.pencil}</button><button class="act" type="button" data-act="save" title="Save as a named command" aria-label="Save">${ICON.bookmark}</button></div><div class="bubble">${richText(m.text, m.icons)}</div></div>
    </div>`;
    return user + agentHTML(m);
  }

  function agentHTML(m) {
    const running = m.status === "running";
    const direct = m.mode === "direct";
    const steps = m.steps || [];
    const showSteps = steps.length && (running || m.ask || m.showSteps);
    const doneSteps = steps.filter((s) => s.status === "ok").length;
    let body = "";
    if (m.resolved) body += `<div class="understood"><b>Understood as</b>${esc(m.resolved)}</div>`;
    if (running && !m.ask) {
      const now = m.progress || (steps.length ? steps.at(-1).text : mode === "direct" ? "" : "Looking at the page");
      body += `<div class="working"><span class="dots"><i></i><i></i><i></i></span>${now ? `<span class="now">${esc(capital(now))}</span>` : ""}</div>`;
    }
    if (!running && m.detail) {
      if (direct) body += `<div class="text"><span class="mk">${MARK[m.status] ? ICON[MARK[m.status]] : ""}</span><span>${esc(m.detail)}${m.cost >= 0.00005 ? `<span class="dcost">${money(m.cost)}</span>` : ""}</span></div>`;
      else body += `${m.status === "fail" ? `<div class="failhead">${ICON.warn}Didn't finish</div>` : ""}<div class="text">${esc(m.detail)}</div>`;
    }
    if (m.note) body += `<p class="note">${esc(m.note)}</p>`;
    if (m.table) body += tableHTML(m.table);
    if (m.images?.length) body += `<div class="shots">${m.images.map((im, k) => `<figure class="shot">
      ${im.src ? `<img src="${esc(im.src)}" alt="Screenshot${im.title ? ` of ${esc(im.title)}` : ""}" data-act="shot-open" data-k="${k}" title="Open the full screenshot">` : `<button type="button" class="gone" data-act="shot-open" data-k="${k}">${ICON.image}<span>Screenshot (open the saved file)</span></button>`}
      ${im.path ? `<div class="sacts"><button type="button" data-act="shot-copy" data-k="${k}">${ICON.copy}<span>Copy</span></button><button type="button" data-act="shot-reveal" data-k="${k}">${ICON.image}<span>Show in Finder</span></button></div>` : ""}
    </figure>`).join("")}</div>`;
    if (showSteps) body += `<ol class="steps">${steps.map((s) => `<li class="step ${s.status}">${mark(s.status)}<span class="t">${esc(s.text)}${s.detail ? `<small>${esc(s.detail)}</small>` : ""}</span></li>`).join("")}</ol>`;
    if (m.ask) body += `<div class="ask"><p>${esc(m.ask.text)}</p><div class="acts" data-ask></div></div>`;
    if (!running) {
      const info = [];
      if (m.done && m.at && steps.length && !direct) info.push(`Worked for ${secs(m.done - m.at)}`);
      const names = (m.models || []).map((x) => String(x).split("/").pop());
      if (names.length && !direct) info.push(names.length > 1 ? `${names[0]} +${names.length - 1}` : names[0]);
      if (m.cost >= 0.00005 && !direct) info.push(money(m.cost));
      const acts = [
        steps.length && !direct ? `<button class="act tog" type="button" data-act="steps" aria-expanded="${Boolean(m.showSteps)}" title="Show the steps">${ICON.chevron}<span>${steps.length} step${steps.length === 1 ? "" : "s"}</span></button>` : "",
        info.length ? `<span class="info"${names.length > 1 ? ` title="Models used: ${esc(names.join(", "))}"` : ""}>${esc(info.join(" · "))}</span>` : "",
        m.detail && !direct ? `<button class="act hov" type="button" data-act="copy" title="Copy" aria-label="Copy">${ICON.copy}</button>` : "",
        m.recipe ? `<button class="act hov" type="button" data-act="save-recipe" title="Save these ${doneSteps || steps.length} steps as a command that runs without the AI" aria-label="Save as command">${ICON.bookmark}</button>` : "",
        m.status === "fail" || m.status === "ignored" ? `<button class="act hov" type="button" data-act="retry" title="Try again" aria-label="Try again">${ICON.retry}</button>` : "",
        m.shot ? `<button class="act hov" type="button" data-act="open" title="${m.status === "fail" ? "Screenshot of the page" : "Open"}" aria-label="Open">${ICON.image}</button>` : "",
        m.alt ? `<button class="link hov" type="button" data-act="alt">${esc(m.alt.label)}</button>` : "",
      ].join("");
      if (acts.replace(/\s/g, "")) body += `<div class="meta">${acts}</div>`;
    }
    return `<div class="msg agent ${m.status}${direct ? " direct" : ""}" data-id="${m.id}" role="article" aria-busy="${running}">${body}</div>`;
  }

  function renderChats(box) {
    const list = chats.filter((c) => c.msgs.length);
    box.innerHTML = `<div class="view">
      <div class="vhead"><h2>Past chats</h2><button class="back" type="button" data-act="back">${ICON.chevron}Back</button></div>
      ${list.length ? list.map((c) => `
        <div class="row${c.id === activeId ? " on" : ""}" role="button" tabindex="0" data-chat="${c.id}">
          <span class="rmark">${ICON.chat}</span>
          <div class="main"><div class="line"><span class="cmd">${richText(c.title || c.msgs[0]?.text || "Untitled")}</span><span class="time">${ago(c.msgs.at(-1)?.at || c.at)}</span></div>
            <div class="sub">${esc(c.msgs.at(-1)?.detail || c.msgs.at(-1)?.text || "")}</div></div>
          <div class="acts-row"><button class="act" type="button" data-act="delete-chat" data-id="${c.id}" title="Delete chat" aria-label="Delete chat">${ICON.trash}</button></div>
        </div>`).join("") : `<p class="empty">No chats yet.</p>`}
    </div>`;
  }

  function renderSaved(box) {
    box.innerHTML = `<div class="view">
      <div class="vhead"><h2>Saved commands</h2><button class="btn" id="add-saved" type="button">${ICON.plus}<span>New</span></button><button class="back" type="button" data-act="back">${ICON.chevron}Back</button></div>
      <p class="vnote">Run one by typing its name. Put <span class="token">{}</span> where a value goes, then type it after the name.</p>
      ${addingSaved ? `<form class="form" id="saved-form">
        <input class="field" id="saved-name" placeholder="Name, e.g. yt" aria-label="Name" autocomplete="off" spellcheck="false" style="flex:0 0 90px" />
        <input class="field" id="saved-text" placeholder="e.g. open youtube, search for {}" aria-label="Command" autocomplete="off" spellcheck="false" />
        <button class="btn primary" type="submit">Save</button></form>` : ""}
      ${saved.map((c) => `
      <div class="row" role="button" tabindex="0" data-saved="${esc(c.name)}" title="Put it in the message box">
        <span class="rmark">${ICON.bookmark}</span>
        <div class="main"><div class="line"><span class="cmd name">${esc(c.name)}</span><span class="time">${c.recipe ? `${c.recipe.length} step${c.recipe.length === 1 ? "" : "s"}, no AI` : ""}</span></div><div class="sub">${esc(c.text)}${recipeSlots(c).length ? `<br>Values: ${recipeSlots(c).map((n) => `<span class="token">${esc(n)}</span>`).join(" ")}` : ""}</div></div>
        <div class="acts-row">
          <button class="act" type="button" data-act="run-saved" data-name="${esc(c.name)}" title="Run" aria-label="Run">${ICON.play}</button>
          <button class="act" type="button" data-act="delete-cmd" data-name="${esc(c.name)}" title="Delete" aria-label="Delete">${ICON.trash}</button>
        </div>
      </div>`).join("")}
      ${!saved.length && !addingSaved ? `<p class="empty">Nothing saved yet. After a request finishes, use the bookmark under the reply to keep its steps.</p>` : ""}
    </div>`;
    $("add-saved").onclick = () => { addingSaved = !addingSaved; render(); if (addingSaved) $("saved-name").focus(); };
    $("saved-form")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("saved-name").value.trim(), text = $("saved-text").value.trim();
      if (!name || !text) return;
      send({ type: "commands:save", name, text });
      addingSaved = false;
      setStatus(`Saved. Type “${name.toLowerCase().replace(/\s+/g, "-")}${hasSlots(text) ? " …" : ""}” to run it.`, "ok");
    });
  }

  function renderSecrets(box) {
    box.innerHTML = `<div class="view">
      <div class="vhead"><h2>Passwords</h2><button class="btn" id="add-secret" type="button">${ICON.plus}<span>Add</span></button><button class="back" type="button" data-act="back">${ICON.chevron}Back</button></div>
      <p class="vnote">Use <span class="token">{{name}}</span> in a message. The value is typed into the page and never sent to the AI.</p>
      ${addingSecret ? `<form class="form" id="secret-form">
        <input class="field" id="secret-name" placeholder="Name, e.g. dev-password" aria-label="Name" autocomplete="off" spellcheck="false" />
        <input class="field" id="secret-value" type="password" placeholder="Password" aria-label="Password" autocomplete="new-password" />
        <button class="btn primary" type="submit">Save</button></form>` : ""}
      ${secrets.map((n) => `
        <div class="row" tabindex="0">
          <span class="rmark">${ICON.key}</span>
          <div class="main"><div class="line"><span class="cmd token">{{${esc(n)}}}</span><span class="time">In Keychain</span></div></div>
          <div class="acts-row"><button class="act" type="button" data-act="delete-secret" data-name="${esc(n)}" title="Delete from Keychain" aria-label="Delete">${ICON.trash}</button></div>
        </div>`).join("")}
      ${!secrets.length && !addingSecret ? `<p class="empty">No passwords yet.</p>` : ""}
    </div>`;
    $("add-secret").onclick = () => { addingSecret = !addingSecret; render(); if (addingSecret) $("secret-name").focus(); };
    $("secret-form")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("secret-name").value.trim(), value = $("secret-value").value;
      if (!name || !value) return setStatus("Give the password a name and a value.", "warn");
      send({ type: "secrets:set", name, value });
      addingSecret = false;
      setStatus(`Saved {{${name}}} to your Keychain.`, "ok");
    });
  }

  function setView(v) {
    view = v;
    if (v === "secrets") send({ type: "secrets:list" });
    render(v === "chat");
  }

  $("chat").addEventListener("click", (e) => {
    const ex = e.target.closest("[data-example]");
    if (ex) return setCmd(ex.dataset.example);
    const act = e.target.closest("[data-act]");
    const msgEl = e.target.closest(".msg");
    const m = msgEl ? chat().msgs.find((x) => x.id === msgEl.dataset.id) : null;
    if (act) {
      e.stopPropagation();
      const a = act.dataset.act, name = act.dataset.name;
      if (a === "back") setView("chat");
      else if (a === "steps" && m) { m.showSteps = !m.showSteps; render(); }
      else if (a === "copy" && m) copyText(m.detail);
      else if (a === "edit" && m) { setMode(m.mode === "direct" ? "direct" : "chat"); setCmd(m.text); }
      else if (a === "save" && m) askSaveAs(m.text, null);
      else if (a === "save-recipe" && m) askSaveAs(m.text, m.recipe);
      else if (a === "retry" && m) retry(m);
      else if (a === "open" && m?.shot) window.bar.openPath(m.shot);
      else if (a === "shot-open" && m?.images) window.bar.openPath(m.images[Number(act.dataset.k)]?.path);
      else if (a === "shot-reveal" && m?.images) window.bar.revealPath?.(m.images[Number(act.dataset.k)]?.path);
      else if (a === "shot-copy" && m?.images) window.bar.copyImage?.(m.images[Number(act.dataset.k)]?.path).then((ok) => setStatus(ok ? "Screenshot copied. Paste it anywhere." : "Couldn't copy the screenshot.", ok ? "ok" : "err"));
      else if (a === "alt" && m?.alt) run(m.alt.text, { as: m.alt.mode });
      else if (a === "delete-chat") deleteChat(act.dataset.id);
      else if (a === "run-saved") { const c = saved.find((x) => x.name === name); setView("chat"); if (c && hasSlots(c.text)) { setCmd(`${name} `); setStatus(`Type ${slotNames(c.text)} after the name, then press Enter.`, "info"); } else run(name); }
      else if (a === "delete-cmd") { send({ type: "commands:delete", name }); setStatus(`Deleted “${name}”.`, "ok"); }
      else if (a === "delete-secret") { send({ type: "secrets:delete", name }); setStatus(`Removed {{${name}}} from your Keychain.`, "ok"); }
      return;
    }
    const row = e.target.closest(".row");
    if (row?.dataset.chat) return openChat(row.dataset.chat);
    if (row?.dataset.saved) { setView("chat"); return setCmd(row.dataset.saved); }
  });
  $("chat").addEventListener("keydown", (e) => {
    const row = e.target.closest?.(".row");
    if (!row || e.target !== row) return;
    const rows = [...$("chat").querySelectorAll(".row")];
    const k = rows.indexOf(row);
    if (e.key === "ArrowDown") { e.preventDefault(); rows[k + 1]?.focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); rows[k - 1]?.focus(); }
    else if (e.key === "Enter") { e.preventDefault(); row.click(); }
  });

  function askSaveAs(text, recipe) {
    const suggestion = recipe
      ? text.toLowerCase().replace(/@\[[^\]]*\]/g, " ").split(/[^a-z0-9]+/).filter((w) => w && !/^(go|to|and|in|on|create|add|make|a|an|the|some|with|dummy|data|please|of|for|it|open|me)$/.test(w)).slice(0, 2).join("-") || "task"
      : (text.match(/(?:localhost|[\w-]+\.\w+)[^\s,]*/)?.[0] || text).split(/[/:,\s]/)[0].slice(0, 20).toLowerCase();
    const s = $("status");
    s.className = "status on";
    s.innerHTML = `<form class="form" id="save-form" style="flex:1;padding:0;align-items:center">
      <span class="msgt" style="flex:0 0 auto">Save as</span>
      <input class="field" id="save-name" placeholder="Name, e.g. login-dev" aria-label="Name" value="${esc(suggestion)}" spellcheck="false" />
      <button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="save-cancel">Cancel</button></form>`;
    clearTimeout(statusTimer);
    $("save-name").select();
    $("save-cancel").onclick = () => { clearStatus(); caretToEnd(); };
    $("save-form").onsubmit = (e) => {
      e.preventDefault();
      const name = $("save-name").value.trim();
      if (!name) return;
      send({ type: "commands:save", name, text, recipe });
      const slug = name.toLowerCase().replace(/\s+/g, "-");
      const slots = recipeSlots({ recipe });
      setStatus(recipe ? `Saved. Type “${slug}” to repeat it without the AI${slots.length ? `; change values with “${slug} ${slots.join(", ")}”` : ""}.` : `Saved. Type “${slug}” to run it.`, "ok");
      caretToEnd();
    };
  }
  setInterval(() => view === "chats" && !document.activeElement?.closest?.(".row, .form") && render(), 30000);

  // ── sending ─────────────────────────────────────────────
  /** reply: an answer to a prompt ("confirm", "2"): same message, nothing new in the chat. */
  function run(text, { reply = false, icons = null, as = null } = {}) {
    const c = chat();
    const m0 = as || mode;
    const msgMode = reply ? current?.mode || m0 : m0;
    const isChat = msgMode === "chat";
    if (!send({ type: "command", text, thread: c.id, followUp: isChat, chat: isChat })) return setStatus("Not connected to the browser service yet.", "err");
    if (reply) return render();
    if (current && current.status === "running") { current.status = "ignored"; current.detail = "Replaced by your next message"; current.done = Date.now(); }
    lastText = text; lastMode = msgMode;
    current = { id: uid(), text, mode: msgMode, status: "running", at: Date.now(), usd0: usage?.todayUsd, ...(icons && Object.keys(icons).length ? { icons } : {}) };
    c.msgs.push(current);
    c.at = Date.now();
    if (!c.title) c.title = text.slice(0, 80);
    chats.splice(chats.indexOf(c), 1);
    chats.unshift(c);
    newId = current.id;
    busy = true;
    view = "chat";
    syncGo();
    render(true);
  }
  // Screenshots arrive as JPEG previews; keep a smaller copy in the chat (the PNG stays in Downloads).
  function shrink(src, max = 760) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / img.naturalWidth);
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(Math.min(img.naturalHeight * k, max * 1.6));
        c.getContext("2d").drawImage(img, 0, 0, img.naturalWidth * k, img.naturalHeight * k);
        resolve(c.toDataURL("image/jpeg", 0.78));
      };
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }
  function attachImages(m, list) {
    const shots = (list || []).filter((x) => x?.image || x?.path);
    if (!m || !shots.length) return;
    m.images = shots.map((x) => ({ path: x.path, title: x.title }));
    shots.forEach((x, k) => x.image && shrink(x.image).then((src) => { if (m.images[k]) { m.images[k].src = src; render(); } }));
  }
  function setProgress(text) {
    if (current) { current.progress = text; render(); }
  }
  function finish(status, detail) {
    if (!current) return;
    if (current.status === "running") notifyDone(current, status, detail);
    if (current.usd0 != null && usage) { current.cost = Math.max(0, usage.todayUsd - current.usd0); }
    delete current.usd0;
    delete current.progress;
    current.status = status;
    current.done = Date.now();
    if (detail !== undefined && detail !== null) current.detail = detail;
    for (const s of current.steps || []) if (s.status === "running") s.status = status === "ok" ? "ok" : "ignored";
    delete current.ask;
    prompt = null;
    current = null;
    busy = false;
    syncGo();
    render();
  }
  // A reply that took a while, while you were in another app, becomes a macOS notification.
  function notifyDone(e, status, detail) {
    if (document.hasFocus() || Date.now() - e.at < 4000 || status === "ignored") return;
    window.bar.notify?.(status === "ok" ? "Done" : "Didn't finish", detail || e.text.replace(/@\[([^\]]+)\]/g, "$1"));
  }
  const SLOT = /(?<!\{)\{([\w-]*)\}(?!\})/g;
  const hasSlots = (t) => SLOT.test(t) && !(SLOT.lastIndex = 0);
  const slotNames = (t) => [...t.matchAll(SLOT)].map((m) => m[1] || "a value").join(", ");
  async function copyText(text) {
    if (!text) return;
    try { await navigator.clipboard.writeText(text); setStatus("Copied.", "ok"); }
    catch { setStatus("Couldn't copy.", "err"); }
  }
  function stopAll() {
    send({ type: "stop" });
    if (current) delete current.ask;
    prompt = null;
    if (current?.status === "running") finish("ignored", "Stopped");
    caretToEnd();
  }
  // Retrying something that changes data puts it back in the message box instead of running it again.
  const RISKY = /\b(delete|remove|approve|reject|pay|submit|send|archive|cancel|purchase|buy|order|transfer|publish|merge|deploy)\b/i;
  function retry(m) {
    const text = m?.text ?? lastText, as = m?.mode ?? lastMode;
    if (RISKY.test(text)) { setMode(as); setCmd(text); setStatus("Check it, then press Enter to send it again.", "info"); }
    else run(text, { as });
  }

  // ── server connection ───────────────────────────────────
  function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      setEnabled(true);
      caretToEnd();
      send({ type: "secrets:list" });
      refreshTabs(true);
      if (/Reconnecting|Can't reach/.test($("status").textContent)) clearStatus();
    };
    ws.onclose = () => {
      setEnabled(false);
      if (!browserBusy) setStatus("Can't reach the browser service. Reconnecting…", "err");
      setTimeout(connect, 800);
    };
    ws.onmessage = (ev) => handle(JSON.parse(ev.data));
  }

  function handle({ type, payload }) {
    switch (type) {
      case "hello": model = payload.model || ""; break;
      case "tab-list": tabList = payload || []; tabsLoaded = true; renderMentions(); renderCurTab(); break;
      case "commands": saved = payload || []; if (view === "saved") render(); break;
      case "secrets": secrets = payload || []; if (view === "secrets") render(); break;
      case "store-error": setStatus(payload, "err"); break;
      case "stopped": break;
      case "tab-switched":
        if (current && !payload.rest) finish("ok", `${payload.current ? "Using" : "Switched to"} “${payload.title}”.`);
        else setProgress(`In “${payload.title}”`);
        break;
      case "tab-error":
        if (current) finish("fail", payload.error);
        else setStatus(payload.error, "err");
        break;
      case "resolved":
        if (current) { current.resolved = payload.goal; render(); }
        break;
      case "expanded":
        if (current && !current.steps) { current.resolved = payload.text; render(); }
        break;
      case "decision": {
        const p = payload.policy;
        if (p.decision === "act") setProgress(capital(p.summary));
        else if (p.decision === "ignore" && current && !current.steps) {
          if (current.mode === "direct") current.alt = { label: "Ask in Chat instead", text: current.text, mode: "chat" };
          finish("ignored", "That isn't a one-step command.");
        }
        break;
      }
      case "action": {
        const ok = payload.ok !== false;
        const detail = ok ? shortUrl(payload.detail) : payload.detail;
        if (current?.steps) {
          const s = current.steps.find((x) => x.status === "running");
          if (s) { s.detail = detail; render(); }
        } else if (current) {
          const check = /^(assert|wait)_/.test(payload.action?.type || "");
          if (!ok && payload.screenshot) current.shot = payload.screenshot;
          const what = capital(String(payload.label || payload.action?.label || "").trim());
          const plain = /^[\w.-]+=/.test(String(payload.detail || "")) ? "" : detail;
          finish(ok ? "ok" : "fail", ok ? (check ? payload.detail.replace(/^✓ /, "") : what ? `${what}${plain ? ` · ${plain}` : ""}` : plain || "Done") : payload.detail);
        }
        break;
      }
      case "chain": {
        if (!current) break;
        if (!current.steps) current.steps = payload.steps.map((text) => ({ text, status: "pending" }));
        current.steps.forEach((s, i) => {
          if (i < payload.index) s.status = "ok";
          else if (i === payload.index) s.status = payload.status === "failed" ? "fail" : payload.status === "done" ? "ok" : payload.status === "cancelled" ? "ignored" : "running";
        });
        const n = payload.steps.length;
        if (payload.status === "running") setProgress(`Step ${payload.index + 1} of ${n}: ${payload.steps[payload.index]}`);
        else if (payload.status === "done") finish("ok", `Done, ${n} steps.`);
        else if (payload.status === "failed") { if (payload.screenshot) current.shot = payload.screenshot; finish("fail", capital(payload.reason)); }
        else if (payload.status === "cancelled") finish("ignored", "Stopped");
        break;
      }
      case "pending":
        if (payload) ask(`${capital(payload.summary)}?`, [
          { label: "Confirm", kbd: "↵", primary: true, action: answer(() => run("confirm", { reply: true })) },
          { label: "Cancel", kbd: "esc", cancel: true, action: answer(() => run("cancel", { reply: true })) },

        break;
      case "candidates":
        if (payload?.length) ask("Which one did you mean?", payload.map((c) => ({ n: c.n, label: c.label.replace(/^\w+ "?|"$/g, ""), action: answer(() => run(String(c.n), { reply: true })) })), { numbered: true });
        break;
      case "gaveup":

        }
        break;
      case "table":
        if (current) {
          current.table = { columns: payload.columns, rows: payload.rows.slice(0, 6), total: payload.total };
          if (payload.path) current.shot = payload.path;
          finish("ok", `${payload.detail}${payload.copied ? ". Copied, paste it into a spreadsheet." : ""}`);
        }
        break;
      case "usage": usage = payload; renderSpend(); break;
      case "models": models = payload; renderModel(); break;
      case "utility":
        if (current) {
          if (payload.image) attachImages(current, [payload]);
          else if (payload.path) current.shot = payload.path;
          finish("ok", payload.detail || (payload.copied ? "Copied to the clipboard." : "Done."));
        }
        break;
      case "answer":
        if (current) {
          if (payload.model) current.models = [payload.model];
          current.note = payload.source === "general" ? "From general knowledge, not the page."

        if (bad.length) msg += ` Couldn't fill ${bad.join(", ")}.`;
        if (payload.missing?.length) msg += ` No field for ${payload.missing.join(", ")}.`;
        msg += " Not submitted yet: review it, then say “submit it”.";
        if (current) finish(ok.length ? "ok" : "fail", msg);
        break;
      }
      case "goal": {
        if (!current) break;
        current.steps = payload.steps.map((s) => ({ text: s.text, status: s.status, detail: s.detail }));
        if (payload.models?.length) current.models = payload.models;
        if (payload.status === "running") { current.progress = payload.steps.length ? payload.steps.at(-1).text : "Looking at the page"; render(); }

          { label: "Stop", kbd: "esc", cancel: true, action: answer(() => send({ type: "goal:answer", ok: false })) },
          { label: "Allow the rest", link: true, action: answer(() => { send({ type: "goal:answer", ok: true, all: true }); setProgress("Continuing without asking again"); }) },

      case "smart-error":

      case "log":

  }

  // ── composer: text + inline tab chips ───────────────────
  // The message is plain text where "@[Tab title]" marks a tab; in the editor each mention is a

  const cmd = $("cmd");
  let tabList = [];

  const ICONS_KEY = "vb.icons.v1";
  const iconCache = (() => { try { return JSON.parse(localStorage.getItem(ICONS_KEY) || "{}"); } catch { return {}; } })();

    if (!icon || iconCache[title] === icon) return;

  }
  const normTitle = (t) => String(t || "").replace(/^\(\d+\+?\)\s*/, "").replace(/\s+/g, " ").trim().toLowerCase();
  function iconFor(title, extra) {
    if (extra?.[title]) return extra[title];
    const n = normTitle(title);
    return tabList.find((t) => t.title === title)?.icon || iconCache[title] || tabList.find((t) => t.icon && normTitle(t.title) === n)?.icon || Object.entries(iconCache).find(([k]) => normTitle(k) === n)?.[1] || null;
  }
  const urlFor = (title) => tabList.find((t) => t.title === title || normTitle(t.title) === normTitle(title))?.url || "";

  // ── "@": open tabs ──────────────────────────────────────

    box.innerHTML = (mention.pick ? `<div class="head">The agent works in…</div>` : "") + (items.length

    if (!t) return;

    $("curtab-name").textContent = t.title || shortUrl(t.url) || "Untitled";

  }
  function openTabPicker() {

  function pickMention(i) {

  $("newchat").onclick = newChat;

  // ── shortcut recording ──────────────────────────────────
  const SYM = { Command: "⌘", CommandOrControl: "⌘", Control: "⌃", Alt: "⌥", Shift: "⇧" };

    const c = e.code;

  async function onRecordKey(e) {

  }
  function recordHotkey() {
    if (recording) return;
    recording = true;
    setStatus("Press the new shortcut. Esc cancels.", "info");
    clearTimeout(statusTimer);
    window.bar.pauseHotkey(true);
    document.addEventListener("keydown", onRecordKey, true);
  }
  $("spend").onclick = openSpend;
  window.bar.getHotkey().then(showHotkey);

  // ── AI model: Auto, or one you pick; add providers by key ──
  // A popover in the panel (not a native menu) so each provider shows its logo.
  let picker = null; // { sel, adding } while open
  // each inlined logo gets its own gradient ids: with duplicates, a copy inside the hidden picker
  // would be the one the visible chip points at, and the gradient would fall back to a flat colour
  let logoN = 0;
  const logo = (id) => {
    const svg = LOGO[id];
    if (!svg) return ICON.globe;
    const n = ++logoN;
    return svg.replace(/id="([^"]+)"/g, `id="$1-${n}"`).replace(/url\(#([^)]+)\)/g, `url(#$1-${n})`).replace(/href="#([^"]+)"/g, `href="#$1-${n}"`);
  };
  function renderModel() {
    const b = $("model");
    b.hidden = !models || mode !== "chat";
    if (!models) return;
    const pick = models.models.find((m) => m.id === models.preferred);
    // the logo already names the brand, so the chip drops it ("Gemini 3.1 Flash-Lite" -> "3.1 Flash-Lite")
    $("model-name").textContent = pick ? pick.label.replace(/^(?:Gemini|GLM|DeepSeek)\s+(?=\S)/i, "") : "Auto";
    $("model-logo").innerHTML = pick ? logo(pick.providerId) : ICON.bolt;
    b.title = pick ? `${pick.label} (${pick.provider}) answers first; the others step in when it's busy.` : `Auto: the fastest model for each request, from ${models.models.length} available.`;
    if (picker) renderPicker();
  }
  // the rows you can move through with the arrow keys
  function pickerItems() {
    if (picker?.kind === "browser") return (picker.browsers?.list || []).map((b) => ({ kind: "browser", id: b.id, b }));
    if (!models) return [];
    return [
      { kind: "auto", id: "auto" },
      ...models.models.map((m) => ({ kind: "model", id: m.id, m })),
      ...(models.missing || []).map((p) => ({ kind: "add", id: `add:${p.name}`, p })),
    ];
  }
  function renderPicker() {
    const box = $("picker");
    $("model").setAttribute("aria-expanded", String(Boolean(picker)));
    $("browser").setAttribute("aria-expanded", String(picker?.kind === "browser"));
    if (!picker || (picker.kind !== "browser" && !models)) { box.hidden = true; return veil(); }
    const items = pickerItems();
    picker.sel = Math.max(0, Math.min(picker.sel, items.length - 1));
    const check = (on) => `<span class="ck">${on ? ICON.check : ""}</span>`;
    let html = "", prev = null, i = 0;
    if (picker.kind === "browser") html += `<div class="pk-head">Browser to control</div>`;
    for (const it of items) {
      const on = i === picker.sel ? " on" : "";
      if (it.kind === "browser") {
        const b = it.b, cur = picker.browsers.current === b.id;
        html += `<button type="button" class="pk-row${on}" role="option" data-i="${i}" aria-selected="${cur}">
          <span class="lg${b.icon ? " app" : ""}">${b.icon ? `<img src="${esc(b.icon)}" alt="">` : ICON.globe}</span><span class="t">${esc(b.name)}</span>${check(cur)}
          <span class="s">${esc(cur ? "Connected" : b.note)}</span></button>`;
      } else if (it.kind === "auto") {
        html += `<button type="button" class="pk-row${on}" role="option" data-i="${i}" aria-selected="${models.preferred === "auto"}">
          <span class="lg">${ICON.bolt}</span><span class="t">Auto</span>${check(models.preferred === "auto")}
          <span class="s">Fastest model for each request; switches when one is busy</span></button>`;
      } else if (it.kind === "model") {
        const m = it.m;
        if (prev !== m.providerId) html += `<div class="pk-sep"></div>`;
        const s = [m.provider, m.vision ? "Reads screenshots" : "Text only", m.fast ? "Fast" : ""].filter(Boolean).join(" · ");
        html += `<button type="button" class="pk-row${on}" role="option" data-i="${i}" aria-selected="${models.preferred === m.id}">
          <span class="lg">${logo(m.providerId)}</span><span class="t">${esc(m.label)}</span>${check(models.preferred === m.id)}
          <span class="s">${esc(s)}${m.resting ? ` · <span class="rest">${esc(capital(m.resting))}</span>` : ""}</span></button>`;
        prev = m.providerId;
      } else {
        if (prev !== "add") html += `<div class="pk-sep"></div><div class="pk-head">Add a provider</div>`;
        const p = it.p;
        html += `<button type="button" class="pk-row add${on}" role="option" data-i="${i}">
          <span class="lg">${logo(p.name)}</span><span class="t">${esc(p.label)}</span><span class="ck">${ICON.plus}</span>
          <span class="s">Paste an API key to use its models</span></button>`;
        if (picker.adding === p.name) {
          html += `<form class="pk-form" id="pk-form"><input class="field" id="pk-key" type="password" placeholder="${esc(p.label)} API key" aria-label="${esc(p.label)} API key" autocomplete="off" spellcheck="false" />
            <button class="btn primary" type="submit">Add</button><button class="link" type="button" id="pk-get">Get a key</button></form>`;
        }
        prev = "add";
      }
      i++;
    }
    box.innerHTML = html;
    box.classList.toggle("below", picker.kind === "browser");
    if (picker.kind === "browser") { box.style.top = `${document.querySelector(".top").getBoundingClientRect().bottom}px`; box.style.bottom = "auto"; }
    else { box.style.top = "auto"; box.style.bottom = `${innerHeight - $("form").getBoundingClientRect().top + 6}px`; }
    box.hidden = false;
    veil();
    if (!picker.adding) box.querySelector(".pk-row.on")?.scrollIntoView({ block: "nearest" });
    const f = $("pk-form");
    if (f) {
      const p = models.missing.find((x) => x.name === picker.adding);
      $("pk-get").onclick = () => window.bar.openUrl?.(p.keyUrl);
      f.onsubmit = (e) => {
        e.preventDefault();
        const key = $("pk-key").value.trim();
        if (!key) return;
        send({ type: "provider:key", provider: p.name, key });
        closePicker();
        setStatus(`Added ${p.label}. Its models are in the list now, and Auto uses them too.`, "ok");
      };
    }
  }
  function openPicker() {
    send({ type: "models:list" });
    closeMentions();
    picker = { kind: "model", sel: 0, adding: null };
    picker.sel = Math.max(0, pickerItems().findIndex((it) => it.id === models?.preferred));
    renderPicker();
  }
  async function openBrowserPicker() {
    closeMentions();
    const browsers = await window.bar.listBrowsers?.().catch(() => null);
    if (!browsers) return window.bar.browserMenu(); // older app shell: the native menu
    picker = { kind: "browser", sel: 0, browsers };
    picker.sel = Math.max(0, pickerItems().findIndex((it) => it.id === browsers.current));
    renderPicker();
  }
  function closePicker(refocus = true) {
    if (!picker) return;
    picker = null;
    renderPicker();
    if (refocus) caretToEnd();
  }
  function choosePicker(i) {
    const it = pickerItems()[i];
    if (!it) return;
    if (it.kind === "browser") {
      const cur = picker.browsers.current;
      closePicker();
      if (it.id !== cur) window.bar.chooseBrowser(it.id);
      return;
    }
    if (it.kind === "add") {
      picker.sel = i;
      picker.adding = picker.adding === it.p.name ? null : it.p.name;
      renderPicker();
      return $("pk-key")?.focus();
    }
    send({ type: "models:pick", id: it.id });
    models.preferred = it.id;
    renderModel();
    closePicker();
  }
  $("model").addEventListener("mousedown", (e) => e.preventDefault());
  $("model").onclick = () => (picker?.kind === "model" ? closePicker() : models && openPicker());
  $("picker").addEventListener("mousedown", (e) => { if (!e.target.closest(".pk-form")) e.preventDefault(); });
  $("picker").addEventListener("click", (e) => {
    const row = e.target.closest(".pk-row");
    if (row) choosePicker(Number(row.dataset.i));
  });
  document.addEventListener("mousedown", (e) => { if (picker && !e.target.closest("#picker, #model, #browser")) closePicker(false); });
  // while open, the picker owns the arrow keys / Enter / Esc (except while typing a key)
  document.addEventListener("keydown", (e) => {
    if (!picker || e.target.closest?.(".pk-form")) {
      if (picker && e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); picker.adding = null; renderPicker(); }
      return;
    }
    const n = pickerItems().length;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { picker.sel = (picker.sel + (e.key === "ArrowDown" ? 1 : -1) + n) % n; renderPicker(); }
    else if (e.key === "Enter") choosePicker(picker.sel);
    else if (e.key === "Escape") closePicker();
    else return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);

  // ── controlled browser ──────────────────────────────────
  const shortName = (b) => (b.id === "builtin" ? "Chromium" : `${b.name.replace(/^Google |^Microsoft /, "")}${b.separate ? " (own profile)" : ""}`);
  function showBrowser(b) {
    browserBusy = Boolean(b.busy);
    if (!b.busy) $("browser-ic").innerHTML = b.icon ? `<img src="${esc(b.icon)}" alt="">` : ICON.globe;
    $("browser-name").textContent = b.busy ? "Switching…" : shortName(b);
    $("browser").dataset.state = b.busy ? "off" : "on";
    $("browser").title = b.busy ? b.busy : `Controlling ${b.id === "builtin" ? "the built-in Chromium" : b.name}. Click to choose another browser.`;
    if (b.busy) setStatus(b.busy, "busy");
    else if (b.error) setStatus(b.error, "err");
    else if (b.note) setStatus(b.note, "warn");
  }
  window.bar.onBrowserState((b) => {
    showBrowser(b);
    if (!b.busy && !b.error) setStatus(b.id === "builtin" ? "Controlling the built-in Chromium." : `Connected to ${b.name}.${b.separate ? " It uses its own profile, so sign in there once." : ""}`, "ok");
  });
  window.bar.onBrowserConfirm((b) => {
    const short = b.name.replace(/^Google |^Microsoft /, "");
    const cancel = { label: "Cancel", action: () => { clearStatus(); caretToEnd(); } };
    if (b.ownProfile || b.separate) {
      setStatus(`${b.name} can only be controlled in a separate profile. Your main window stays as it is.`, "warn", [{ label: `Open ${short}`, primary: true, action: () => window.bar.switchBrowser(b.id) }, cancel]);
    } else {
      setStatus(`Quit ${b.name} and reopen it so Voice Browser can control it? Your tabs come back.`, "warn", [{ label: `Restart ${short}`, primary: true, action: () => window.bar.switchBrowser(b.id) }, cancel]);
    }
    clearTimeout(statusTimer);
  });
  $("browser").addEventListener("mousedown", (e) => e.preventDefault());
  $("browser").onclick = () => (picker?.kind === "browser" ? closePicker() : openBrowserPicker());
  $("more").onclick = () => window.bar.appMenu({ model });
  window.bar.onMenuAction?.((a) => {
    if (a === "undo") send({ type: "undo" });
    else if (a === "record-hotkey") recordHotkey();
    else if (a === "new-chat") newChat();
    else if (a === "view-chats") setView("chats");
    else if (a === "view-saved") setView("saved");
    else if (a === "view-secrets") setView("secrets");
    else if (a === "models") openPicker();
  });
  window.bar.onFocusInput(() => { caretToEnd(); refreshTabs(true); });
  window.addEventListener("focus", () => refreshTabs(true));
  window.bar.onServerExit((info) => setStatus(`The browser service keeps stopping (code ${info.code}). Details are in ~/.voice-browser/server.log. Reopen the app to try again.`, "err"));

  setMode(mode);
  render(true);
  (async () => {
    setStatus("Starting the browser", "busy");
    const r = await window.bar.ensureServer();
    window.bar.getBrowser().then(showBrowser);
    if (!r.ok) setStatus(r.error, "warn");
    else clearStatus();
    connect(); // keeps retrying until the service is up
  })();
</script>
</body>
</html>
