name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Headless Chromium (one test attaches to a real browser)
        run: npx playwright install --with-deps --only-shell chromium
      - name: Unit tests (no network, no keys)
        run: npm test
      - name: Check desktop app scripts parse
        run: for f in desktop/*.cjs; do node --check "$f"; done
